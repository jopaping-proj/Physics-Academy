<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img"
     aria-label="Two blocks on a frictionless table connected by a light string: a 2.0 kg block behind and a 3.0 kg block in front. A 20 newton horizontal force pulls the front block, and both blocks accelerate together.">
  <!-- Hand-authored scene. Labels placed clear of the blocks, the string
       and the force arrow (master-project-prompt.md §11). -->
  <defs>
    <marker id="tb-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="tb-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f0c27a"/></marker>
  </defs>

  <!-- table -->
  <line x1="14" y1="104" x2="306" y2="104" stroke="#8b96a5" stroke-width="2"/>
  <g stroke="#8b96a5" stroke-width="1.1">
    <line x1="34" y1="104" x2="26" y2="114"/><line x1="74" y1="104" x2="66" y2="114"/>
    <line x1="114" y1="104" x2="106" y2="114"/><line x1="154" y1="104" x2="146" y2="114"/>
    <line x1="194" y1="104" x2="186" y2="114"/><line x1="234" y1="104" x2="226" y2="114"/>
    <line x1="274" y1="104" x2="266" y2="114"/>
  </g>

  <!-- back block (2.0 kg) -->
  <rect x="66" y="76" width="46" height="28" rx="2" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="1.5"/>
  <text x="89" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#3fb950">2.0 kg</text>

  <!-- string -->
  <line x1="112" y1="90" x2="140" y2="90" stroke="#f0c27a" stroke-width="2.5"/>

  <!-- front block (3.0 kg) -->
  <rect x="140" y="72" width="54" height="32" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="167" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#58a6ff">3.0 kg</text>

  <!-- applied force -->
  <line x1="194" y1="84" x2="246" y2="84" stroke="#f0c27a" stroke-width="3" marker-end="url(#tb-amber)"/>
  <text x="254" y="84" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0c27a">F = 20 N</text>

  <!-- acceleration -->
  <line x1="120" y1="122" x2="152" y2="122" stroke="#8b96a5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#tb-grey)"/>
  <text x="136" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">a</text>
</svg>
