<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" role="img"
     aria-label="An Atwood machine: two blocks hang from a single rope over a pulley fixed to the ceiling. The tension is the same in both rope segments. Block m1 is heavier, so its weight arrow is longer than m2's; the net force makes m1 accelerate downward and m2 accelerate upward with the same acceleration a.">
  <!-- Hand-authored. Labels placed clear of the blocks, the rope, the
       pulley, and each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="at-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <text x="150" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">equal tension, unequal weights &#8594; the heavier side falls</text>

  <!-- ceiling -->
  <line x1="66" y1="28" x2="234" y2="28" stroke="#8b96a5" stroke-width="2"/>
  <g stroke="#8b96a5" stroke-width="1.1">
    <line x1="86" y1="28" x2="78" y2="20"/><line x1="116" y1="28" x2="108" y2="20"/>
    <line x1="146" y1="28" x2="138" y2="20"/><line x1="176" y1="28" x2="168" y2="20"/>
    <line x1="206" y1="28" x2="198" y2="20"/>
  </g>
  <line x1="150" y1="28" x2="150" y2="32" stroke="#8b96a5" stroke-width="2"/>

  <!-- pulley -->
  <circle cx="150" cy="50" r="20" fill="none" stroke="#8b96a5" stroke-width="2"/>
  <circle cx="150" cy="50" r="2.4" fill="#8b96a5"/>

  <!-- rope -->
  <path d="M130 50 V130" fill="none" stroke="#f0c27a" stroke-width="2.5"/>
  <path d="M130 50 A20 20 0 0 1 170 50" fill="none" stroke="#f0c27a" stroke-width="2.5"/>
  <path d="M170 50 V88" fill="none" stroke="#f0c27a" stroke-width="2.5"/>
  <text x="108" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">F&#8348;</text>
  <text x="192" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">F&#8348;</text>

  <!-- block m1 (heavier, lower) -->
  <rect x="111" y="130" width="38" height="34" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="130" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#58a6ff">m&#8321;</text>
  <!-- block m2 (lighter, higher) -->
  <rect x="154" y="88" width="32" height="28" rx="2" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="1.5"/>
  <text x="170" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3fb950">m&#8322;</text>

  <!-- weight arrows -->
  <line x1="130" y1="164" x2="130" y2="208" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#at-grey)"/>
  <text x="130" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b96a5">m&#8321;g</text>
  <line x1="170" y1="116" x2="170" y2="144" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#at-grey)"/>
  <text x="184" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b96a5">m&#8322;g</text>

  <!-- acceleration -->
  <line x1="96" y1="134" x2="96" y2="166" stroke="#8b96a5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#at-grey)"/>
  <text x="88" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">a</text>
  <line x1="206" y1="116" x2="206" y2="86" stroke="#8b96a5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#at-grey)"/>
  <text x="214" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">a</text>
</svg>
