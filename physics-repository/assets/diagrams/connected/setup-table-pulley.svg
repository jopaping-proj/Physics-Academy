<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 208" role="img"
     aria-label="A block of mass m1 sits on a frictionless table. A rope runs from the block horizontally to a pulley at the edge of the table, then straight down to a hanging block of mass m2. When released, m1 accelerates toward the pulley and m2 accelerates downward, both with the same acceleration a because the rope does not stretch.">
  <!-- Hand-authored scene. Labels placed clear of the blocks, the rope,
       the pulley and each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="cn-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <text x="150" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">one rope, so one acceleration for both blocks</text>

  <!-- table -->
  <line x1="18" y1="86" x2="214" y2="86" stroke="#8b96a5" stroke-width="2"/>
  <g stroke="#8b96a5" stroke-width="1.1">
    <line x1="34" y1="86" x2="26" y2="98"/><line x1="70" y1="86" x2="62" y2="98"/>
    <line x1="106" y1="86" x2="98" y2="98"/><line x1="142" y1="86" x2="134" y2="98"/>
    <line x1="178" y1="86" x2="170" y2="98"/>
  </g>
  <line x1="40" y1="86" x2="40" y2="170" stroke="#8b96a5" stroke-width="2"/>
  <line x1="196" y1="86" x2="196" y2="170" stroke="#8b96a5" stroke-width="2"/>
  <line x1="20" y1="170" x2="216" y2="170" stroke="#8b96a5" stroke-width="1.5"/>

  <!-- block m1 -->
  <rect x="70" y="58" width="52" height="28" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="96" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#58a6ff">m&#8321;</text>

  <!-- pulley: centre (232, 85), top tangent at y = 72 -->
  <circle cx="232" cy="85" r="13" fill="none" stroke="#8b96a5" stroke-width="2"/>
  <circle cx="232" cy="85" r="2.4" fill="#8b96a5"/>

  <!-- rope: block -> over pulley -> hanging block -->
  <path d="M122 72 H232" fill="none" stroke="#f0c27a" stroke-width="2.5"/>
  <path d="M232 72 A13 13 0 0 1 245 85" fill="none" stroke="#f0c27a" stroke-width="2.5"/>
  <path d="M245 85 V128" fill="none" stroke="#f0c27a" stroke-width="2.5"/>

  <!-- hanging block m2 -->
  <rect x="231" y="128" width="28" height="40" rx="2" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="1.5"/>
  <text x="245" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#3fb950">m&#8322;</text>

  <!-- acceleration arrows -->
  <line x1="130" y1="102" x2="162" y2="102" stroke="#8b96a5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#cn-grey)"/>
  <text x="146" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">a</text>
  <line x1="288" y1="128" x2="288" y2="160" stroke="#8b96a5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#cn-grey)"/>
  <text x="296" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">a</text>
</svg>
