<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 128" role="img"
     aria-label="A light rod 1.0 metre long with a small 1 kilogram ball at the left end and a large 4 kilogram ball at the right end.">
  <!-- Labels placed clear of the rod, the balls, and each other (master-project-prompt.md §11). -->

  <!-- rod: 0 m at x=52px, 1.0 m at x=248px -->
  <line x1="52" y1="76" x2="248" y2="76" stroke="#8b96a5" stroke-width="2"/>

  <!-- 1 kg ball at the left end -->
  <circle cx="52" cy="76" r="7" fill="#58a6ff"/>
  <text x="52" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">1 kg</text>

  <!-- 4 kg ball at the right end -->
  <circle cx="248" cy="76" r="13" fill="#58a6ff"/>
  <text x="248" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">4 kg</text>

  <!-- length -->
  <line x1="52" y1="52" x2="248" y2="52" stroke="#8b96a5" stroke-width="1"/>
  <line x1="52" y1="48" x2="52" y2="56" stroke="#8b96a5" stroke-width="1"/>
  <line x1="248" y1="48" x2="248" y2="56" stroke="#8b96a5" stroke-width="1"/>
  <text x="150" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">1.0 m</text>
</svg>
