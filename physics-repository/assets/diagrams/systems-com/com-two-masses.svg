<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 150" role="img"
     aria-label="A number line from 0 to 5 metres. A small 2 kilogram mass sits at 0 metres and a larger 6 kilogram mass sits at 4 metres. A star marks the centre of mass at 3.0 metres — between the two masses and three times closer to the heavier 6 kilogram mass.">
  <!-- Labels are placed clear of the axis, the masses, and each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="cm-tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><path d="M5 0 V10" stroke="#8b96a5"/></marker>
  </defs>

  <!-- axis: 0 m at x=44px, 1 m = 48px -->
  <line x1="34" y1="96" x2="300" y2="96" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5" text-anchor="middle">
    <line x1="44" y1="92" x2="44" y2="100"/><text x="44" y="114">0</text>
    <line x1="92" y1="92" x2="92" y2="100"/><text x="92" y="114">1</text>
    <line x1="140" y1="92" x2="140" y2="100"/><text x="140" y="114">2</text>
    <line x1="188" y1="92" x2="188" y2="100"/><text x="188" y="114">3</text>
    <line x1="236" y1="92" x2="236" y2="100"/><text x="236" y="114">4</text>
    <line x1="284" y1="92" x2="284" y2="100"/><text x="284" y="114">5</text>
  </g>
  <text x="306" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">m</text>

  <!-- centre-of-mass guide + star at x = 3.0 m (188px) -->
  <line x1="188" y1="40" x2="188" y2="96" stroke="#f0c27a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M188 30 l3.1 6.9 7.5 0.8 -5.6 5.1 1.5 7.4 -6.4 -3.9 -6.4 3.9 1.5 -7.4 -5.6 -5.1 7.5 -0.8 z" fill="#f0c27a"/>
  <text x="188" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">centre of mass — 3.0 m</text>

  <!-- 2 kg at 0 m (44px) -->
  <circle cx="44" cy="96" r="7" fill="#58a6ff"/>
  <text x="44" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">2 kg</text>

  <!-- 6 kg at 4 m (236px) — drawn larger -->
  <circle cx="236" cy="96" r="13" fill="#58a6ff"/>
  <text x="236" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">6 kg</text>

  <!-- gap ratio, above the axis, clear of the mass labels -->
  <text x="116" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">3 m</text>
  <text x="212" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">1 m</text>
</svg>
