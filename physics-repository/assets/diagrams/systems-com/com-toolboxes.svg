<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 132" role="img"
     aria-label="A shelf number line from 0 to 10 metres. A 3 kilogram tool box sits at 2 metres and a 1 kilogram tool box sits at 10 metres. A star marks their centre of mass at 4.0 metres — much closer to the heavier 3 kilogram box.">
  <!-- Labels placed clear of the shelf, the boxes, and each other (master-project-prompt.md §11). -->

  <!-- shelf: 0 m at x=36px, 10 m at x=296px (26 px/m) -->
  <line x1="30" y1="84" x2="302" y2="84" stroke="#8b96a5" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="9" fill="#8b96a5" text-anchor="middle">
    <line x1="36" y1="80" x2="36" y2="88" stroke="#8b96a5" stroke-width="1"/><text x="36" y="100">0</text>
    <line x1="88" y1="80" x2="88" y2="88" stroke="#8b96a5" stroke-width="1"/><text x="88" y="100">2</text>
    <line x1="140" y1="80" x2="140" y2="88" stroke="#8b96a5" stroke-width="1"/><text x="140" y="100">4</text>
    <line x1="192" y1="80" x2="192" y2="88" stroke="#8b96a5" stroke-width="1"/><text x="192" y="100">6</text>
    <line x1="244" y1="80" x2="244" y2="88" stroke="#8b96a5" stroke-width="1"/><text x="244" y="100">8</text>
    <line x1="296" y1="80" x2="296" y2="88" stroke="#8b96a5" stroke-width="1"/><text x="296" y="100">10</text>
  </g>
  <text x="310" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#8b96a5">m</text>

  <!-- centre-of-mass guide + star at 4.0 m (x=140) -->
  <line x1="140" y1="44" x2="140" y2="84" stroke="#f0c27a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M140 32 l3.1 6.9 7.5 0.8 -5.6 5.1 1.5 7.4 -6.4 -3.9 -6.4 3.9 1.5 -7.4 -5.6 -5.1 7.5 -0.8 z" fill="#f0c27a"/>

  <!-- 3 kg box at 2 m -->
  <rect x="79" y="74" width="18" height="14" rx="2" fill="#58a6ff" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="88" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">3 kg</text>

  <!-- 1 kg box at 10 m -->
  <rect x="290" y="77" width="12" height="10" rx="2" fill="#58a6ff" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="296" y="69" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">1 kg</text>

  <text x="140" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">★ centre of mass — 4.0 m</text>
</svg>
