<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 216" role="img"
     aria-label="Two panels of the same scene: a student on a skateboard throwing a ball. In the left panel the dashed boundary encloses the student, skateboard, and ball, so the throwing force is internal. In the right panel the boundary encloses only the student and skateboard, so the same throwing force is now external and pushes the student backward.">
  <!-- Labels placed clear of the boundaries, blocks, and arrows (master-project-prompt.md §11). -->
  <defs>
    <marker id="sk-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f0c27a"/></marker>
    <marker id="sk-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
  </defs>

  <!-- ===== left panel: system = student + skateboard + ball ===== -->
  <rect x="14" y="44" width="164" height="86" rx="10" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="16" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e6edf3">system: student + board + ball</text>

  <rect x="34" y="64" width="52" height="46" rx="3" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="60" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#58a6ff">student</text>
  <text x="60" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#58a6ff">+ board</text>
  <rect x="126" y="74" width="26" height="26" rx="3" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="139" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#58a6ff">ball</text>

  <line x1="90" y1="87" x2="122" y2="87" stroke="#f85149" stroke-width="2.5" marker-end="url(#sk-red)"/>
  <line x1="122" y1="97" x2="90" y2="97" stroke="#f85149" stroke-width="2.5" marker-end="url(#sk-red)"/>
  <text x="96" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f85149">throw = internal pair</text>
  <text x="96" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f85149">centre of mass does not move</text>

  <!-- ===== right panel: system = student + skateboard only ===== -->
  <rect x="212" y="44" width="104" height="86" rx="10" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="214" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e6edf3">system: student + board</text>

  <rect x="230" y="64" width="52" height="46" rx="3" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="256" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#58a6ff">student</text>
  <text x="256" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#58a6ff">+ board</text>
  <rect x="338" y="74" width="24" height="26" rx="3" fill="#6b7787" fill-opacity="0.12" stroke="#6b7787" stroke-width="1.3"/>
  <text x="350" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#8b96a5">ball (outside)</text>

  <!-- the same throw force, now crossing the boundary: external, pushes student back -->
  <line x1="332" y1="87" x2="285" y2="87" stroke="#f0c27a" stroke-width="3" marker-end="url(#sk-amber)"/>
  <text x="270" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f0c27a">same push = external</text>
  <text x="270" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f0c27a">student's centre of mass rolls back</text>

  <text x="190" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">the force is the same — only the boundary changed</text>
</svg>
