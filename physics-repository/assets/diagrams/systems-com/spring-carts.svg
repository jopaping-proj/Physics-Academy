<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 150" role="img"
     aria-label="A 4 kilogram cart at position 0 and a 12 kilogram cart at position 0.80 metres sit on a frictionless track with a compressed spring held between them by a string. A star marks the centre of mass of the two carts at 0.60 metres — closer to the heavier 12 kilogram cart.">
  <!-- Labels placed clear of the track, the carts, the spring, and each other (master-project-prompt.md §11). -->

  <!-- track: 0 m at x=50px, 0.8 m at x=210px, 1.0 m at x=250px -->
  <line x1="30" y1="104" x2="290" y2="104" stroke="#3a4a6c" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5" text-anchor="middle">
    <line x1="50" y1="100" x2="50" y2="108" stroke="#8b96a5" stroke-width="1"/><text x="50" y="122">0</text>
    <line x1="210" y1="100" x2="210" y2="108" stroke="#8b96a5" stroke-width="1"/><text x="210" y="122">0.80 m</text>
  </g>

  <!-- 4 kg cart, centre at x=50 -->
  <rect x="33" y="80" width="34" height="20" rx="2" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="41" cy="102" r="2.4" fill="#8b96a5"/><circle cx="59" cy="102" r="2.4" fill="#8b96a5"/>
  <text x="50" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">4 kg</text>

  <!-- 12 kg cart, centre at x=210 -->
  <rect x="184" y="76" width="52" height="24" rx="2" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="194" cy="102" r="2.4" fill="#8b96a5"/><circle cx="226" cy="102" r="2.4" fill="#8b96a5"/>
  <text x="210" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">12 kg</text>

  <!-- compressed spring between the carts -->
  <polyline points="67,90 78,84 90,96 102,84 114,96 126,84 138,96 150,84 162,96 174,86 184,90"
            fill="none" stroke="#f0c27a" stroke-width="1.6"/>

  <!-- centre of mass at 0.60 m: track has 0 m at x=50, 0.80 m at x=210 (200 px/m) -> x=170 -->
  <line x1="170" y1="112" x2="170" y2="126" stroke="#f0c27a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M170 126 l3.1 6.9 7.5 0.8 -5.6 5.1 1.5 7.4 -6.4 -3.9 -6.4 3.9 1.5 -7.4 -5.6 -5.1 7.5 -0.8 z" fill="#f0c27a"/>
  <text x="186" y="140" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">★ centre of mass — 0.60 m</text>
</svg>
