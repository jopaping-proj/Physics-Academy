<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A force versus extension graph for a spring: a straight line through the origin. Gridlines mark extension every 0.05 metres up to 0.20 metres and force every 4 newtons up to 16 newtons. The line passes through the marked point at extension 0.05 metres, force 4.0 newtons.">
  <defs>
    <marker id="q2-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- gridlines: x 0.05/0.10/0.15 -> 107.5/169/230.5 ; y 4/8/12 N -> 157/114/71 -->
  <g stroke="#8b96a5" stroke-opacity="0.28" stroke-width="1">
    <line x1="107.5" y1="200" x2="107.5" y2="28"/><line x1="169" y1="200" x2="169" y2="28"/>
    <line x1="230.5" y1="200" x2="230.5" y2="28"/>
    <line x1="46" y1="157" x2="292" y2="157"/><line x1="46" y1="114" x2="292" y2="114"/>
    <line x1="46" y1="71" x2="292" y2="71"/>
  </g>

  <!-- axes -->
  <line x1="46" y1="200" x2="300" y2="200" stroke="#8b96a5" stroke-width="1.5" marker-end="url(#q2-axis)"/>
  <line x1="46" y1="200" x2="46" y2="24" stroke="#8b96a5" stroke-width="1.5" marker-end="url(#q2-axis)"/>

  <!-- x ticks -->
  <g font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5" text-anchor="middle">
    <text x="46" y="214">0</text><text x="107.5" y="214">0.05</text><text x="169" y="214">0.10</text>
    <text x="230.5" y="214">0.15</text><text x="292" y="214">0.20</text>
  </g>
  <!-- y ticks -->
  <g font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5" text-anchor="end">
    <text x="40" y="204">0</text><text x="40" y="161">4</text><text x="40" y="118">8</text>
    <text x="40" y="75">12</text><text x="40" y="32">16</text>
  </g>
  <text x="178" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">extension  x  (m)</text>
  <text x="16" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5" transform="rotate(-90 16 112)">force  F  (N)</text>

  <!-- line through the origin (46,200) and (0.05, 4.0)=(107.5,157), extended to (0.20,16)=(292,28) -->
  <line x1="46" y1="200" x2="292" y2="28" stroke="#3fb950" stroke-width="3"/>

  <!-- given point -->
  <circle cx="107.5" cy="157" r="4" fill="#f0c27a"/>
  <text x="115" y="150" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#f0c27a">(0.05 m, 4.0 N)</text>
</svg>
