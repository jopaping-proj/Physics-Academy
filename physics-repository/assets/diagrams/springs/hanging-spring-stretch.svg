<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 0 196 216" role="img"
     aria-label="A spring hangs from a fixed ceiling. A dashed horizontal line marks where the spring's lower end sits at its natural (unstretched) length. A weight of 6.0 newtons hangs from the spring and stretches it downward by a distance x of 0.12 metres, shown by a dimension arrow between the natural-length line and the stretched end.">
  <defs>
    <marker id="hs-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="hs-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- ceiling -->
  <line x1="70" y1="26" x2="220" y2="26" stroke="#8b96a5" stroke-width="2"/>
  <g stroke="#8b96a5" stroke-width="1">
    <line x1="82" y1="26" x2="74" y2="16"/><line x1="102" y1="26" x2="94" y2="16"/>
    <line x1="122" y1="26" x2="114" y2="16"/><line x1="142" y1="26" x2="134" y2="16"/>
    <line x1="162" y1="26" x2="154" y2="16"/><line x1="182" y1="26" x2="174" y2="16"/>
    <line x1="202" y1="26" x2="194" y2="16"/>
  </g>

  <!-- stretched spring: zig-zag coil from ceiling down to y=150 -->
  <polyline points="150,26 150,40 166,48 134,60 166,72 134,84 166,96 134,108 166,120 134,132 150,140 150,150"
            fill="none" stroke="#58a6ff" stroke-width="2"/>

  <!-- hanging weight -->
  <rect x="132" y="150" width="36" height="26" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- weight force -->
  <line x1="150" y1="176" x2="150" y2="208" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#hs-grey)"/>
  <text x="158" y="198" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b96a5">F = 6.0 N</text>

  <!-- natural-length reference line -->
  <line x1="96" y1="104" x2="196" y2="104" stroke="#8b96a5" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="92" y="101" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">natural length</text>

  <!-- stretched-end reference line -->
  <line x1="108" y1="150" x2="128" y2="150" stroke="#8b96a5" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- dimension x between natural length (y=104) and stretched end (y=150) -->
  <line x1="112" y1="104" x2="112" y2="150" stroke="#8b96a5" stroke-width="1" marker-start="url(#hs-dim)" marker-end="url(#hs-dim)"/>
  <text x="106" y="130" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b96a5">x = 0.12 m</text>
</svg>
