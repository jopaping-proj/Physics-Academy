<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 232" role="img"
     aria-label="A spring fixed to a wall on the left, shown in three states. Top: natural length, no spring force. Middle: stretched to the right by displacement x, the spring force points left, back toward the natural length. Bottom: compressed to the left, the spring force points right, back toward the natural length. In every case the spring force opposes the displacement.">
  <!-- Hand-authored. Labels placed clear of the spring, the wall, the
       arrows and each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="sp-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f0c27a"/></marker>
    <marker id="sp-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- reference: natural-length position -->
  <line x1="188" y1="18" x2="188" y2="214" stroke="#8b96a5" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="188" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">natural length</text>

  <!-- ===== row 1: natural length ===== -->
  <g>
    <rect x="20" y="24" width="10" height="40" fill="#8b96a5" fill-opacity="0.3" stroke="#8b96a5" stroke-width="1.2"/>
    <path d="M30 44 h14 l6 -8 l12 16 l12 -16 l12 16 l12 -16 l12 16 l8 -8 h70" fill="none" stroke="#3fb950" stroke-width="2"/>
    <rect x="188" y="32" width="24" height="24" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="118" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8b96a5">natural length &#183; F&#8347; = 0</text>
  </g>

  <!-- ===== row 2: stretched ===== -->
  <g>
    <rect x="20" y="90" width="10" height="40" fill="#8b96a5" fill-opacity="0.3" stroke="#8b96a5" stroke-width="1.2"/>
    <path d="M30 110 h18 l8 -8 l16 16 l16 -16 l16 16 l16 -16 l16 16 l10 -8 h58" fill="none" stroke="#3fb950" stroke-width="2"/>
    <rect x="230" y="98" width="24" height="24" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.4"/>
    <!-- displacement x to the right -->
    <line x1="200" y1="132" x2="242" y2="132" stroke="#8b96a5" stroke-width="1.5" marker-end="url(#sp-grey)"/>
    <text x="221" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">x</text>
    <!-- spring force back toward natural length (left) -->
    <line x1="228" y1="110" x2="196" y2="110" stroke="#f0c27a" stroke-width="3" marker-end="url(#sp-amber)"/>
    <text x="212" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">F&#8347;</text>
    <text x="300" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">stretched</text>
  </g>

  <!-- ===== row 3: compressed ===== -->
  <g>
    <rect x="20" y="164" width="10" height="40" fill="#8b96a5" fill-opacity="0.3" stroke="#8b96a5" stroke-width="1.2"/>
    <path d="M30 184 h10 l4 -8 l8 16 l8 -16 l8 16 l8 -16 l8 16 l6 -8 h22" fill="none" stroke="#3fb950" stroke-width="2"/>
    <rect x="140" y="172" width="24" height="24" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.4"/>
    <!-- displacement x to the left -->
    <line x1="186" y1="206" x2="152" y2="206" stroke="#8b96a5" stroke-width="1.5" marker-end="url(#sp-grey)"/>
    <text x="169" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">x</text>
    <!-- spring force back toward natural length (right) -->
    <line x1="166" y1="184" x2="200" y2="184" stroke="#f0c27a" stroke-width="3" marker-end="url(#sp-amber)"/>
    <text x="214" y="184" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">F&#8347;</text>
    <text x="96" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">compressed</text>
  </g>
</svg>
