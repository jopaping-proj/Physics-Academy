<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 170" role="img"
     aria-label="Rear view of a car on a banked curve. The road is tilted. Gravity acts straight down. The normal force is perpendicular to the tilted road, pointing up and toward the centre of the curve; a dashed arrow shows its inward horizontal component, which supplies the centripetal force.">
  <defs>
    <marker id="eb-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="eb-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>
  <line x1="26" y1="150" x2="170" y2="92" stroke="#8b96a5" stroke-width="1.4"/>
  <g transform="rotate(-22 96 118)">
    <rect x="80" y="104" width="32" height="17" rx="2" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.3"/>
  </g>
  <circle cx="96" cy="114" r="1.8" fill="#e6edf3"/>
  <line x1="96" y1="114" x2="96" y2="156" stroke="#8b96a5" stroke-width="2.3" marker-end="url(#eb-grey)"/>
  <text x="101" y="152" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8b96a5">mg</text>
  <line x1="93" y1="108" x2="76" y2="62" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#eb-blue)"/>
  <text x="68" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#58a6ff">F<tspan font-size="7" dy="2">N</tspan></text>
  <line x1="96" y1="114" x2="66" y2="114" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#eb-blue)"/>
  <text x="6" y="128" font-family="system-ui, sans-serif" font-size="8.5" fill="#58a6ff">inward part of F<tspan font-size="6" dy="1.5">N</tspan></text>
</svg>
