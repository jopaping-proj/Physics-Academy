<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 128" role="img"
     aria-label="Free-body diagram of a puck on a string moving in a horizontal circle. Left, top view: the only horizontal force is the string tension, pointing toward the centre of the circle. Right, side view: the table's normal force up and gravity down are equal and cancel, so there is no vertical net force.">
  <defs>
    <marker id="p2-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="p2-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
  <line x1="150" y1="14" x2="150" y2="118" stroke="#8b96a5" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- top view -->
  <text x="70" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#8b96a5">top view</text>
  <line x1="118" y1="66" x2="52" y2="66" stroke="#8b96a5" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="118" cy="66" r="2" fill="#8b96a5"/>
  <text x="118" y="82" text-anchor="middle" font-size="8" fill="#8b96a5">centre</text>
  <circle cx="46" cy="66" r="5.5" fill="#e6edf3" stroke="#16213e" stroke-width="1.2"/>
  <line x1="52" y1="66" x2="88" y2="66" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#p2-blue)"/>
  <text x="70" y="57" text-anchor="middle" font-size="10" font-weight="700" fill="#58a6ff">F<tspan font-size="7" dy="2">T</tspan></text>

  <!-- side view -->
  <text x="224" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#8b96a5">side view</text>
  <line x1="176" y1="86" x2="272" y2="86" stroke="#8b96a5" stroke-width="1.3"/>
  <rect x="212" y="76" width="24" height="10" rx="1.5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="1.2"/>
  <line x1="224" y1="81" x2="224" y2="112" stroke="#8b96a5" stroke-width="2.3" marker-end="url(#p2-grey)"/>
  <text x="229" y="110" font-size="9.5" font-weight="700" fill="#8b96a5">mg</text>
  <line x1="218" y1="76" x2="218" y2="44" stroke="#58a6ff" stroke-width="2.3" marker-end="url(#p2-blue)"/>
  <text x="211" y="42" text-anchor="end" font-size="9.5" font-weight="700" fill="#58a6ff">F<tspan font-size="7" dy="2">N</tspan></text>
  <text x="248" y="62" font-size="8" fill="#8b96a5">equal &amp;</text>
  <text x="248" y="72" font-size="8" fill="#8b96a5">opposite</text>
  </g>
</svg>
