<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 150" role="img"
     aria-label="Rear view of a car on a flat curve. Gravity down from the centre and the normal force up from the road are equal. Static friction from the road acts horizontally toward the centre of the curve and is the only unbalanced force.">
  <defs>
    <marker id="ef-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="ef-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="ef-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
  </defs>
  <line x1="18" y1="112" x2="172" y2="112" stroke="#8b96a5" stroke-width="1.4"/>
  <rect x="98" y="92" width="34" height="20" rx="2" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.3"/>
  <line x1="115" y1="102" x2="115" y2="140" stroke="#8b96a5" stroke-width="2.4" marker-end="url(#ef-grey)"/>
  <text x="120" y="136" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8b96a5">mg</text>
  <line x1="106" y1="112" x2="106" y2="66" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#ef-blue)"/>
  <text x="106" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#58a6ff">F<tspan font-size="7" dy="2">N</tspan></text>
  <line x1="98" y1="106" x2="52" y2="106" stroke="#f85149" stroke-width="2.6" marker-end="url(#ef-red)"/>
  <text x="70" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" font-style="italic" fill="#f85149">f</text>
</svg>
