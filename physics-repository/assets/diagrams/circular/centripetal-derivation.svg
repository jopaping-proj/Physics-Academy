<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 258" role="img"
     aria-label="A two-panel geometric derivation of the centripetal acceleration formula, following Cutnell and Johnson section 5.2. Left: an object moves counter-clockwise on a circle of radius r about centre C; at O its velocity v is tangent, and a short time later at P its velocity is tangent but rotated. The radius sweeps the angle theta between O and P. Right: two isosceles triangles. One is formed by the two velocity vectors, each of length v, with the change in velocity delta-v as its base and apex angle theta. The other is formed by the two radii, each of length r, with the chord OP of length approximately v times delta-t as its base and the same apex angle theta. Same apex angle and both isosceles means the triangles are similar, so delta-v over v equals v delta-t over r, which rearranges to delta-v over delta-t equals v squared over r. That is the centripetal acceleration, directed toward the centre.">
  <defs>
    <marker id="cd-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#3fb950"/></marker>
    <marker id="cd-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#d29922"/></marker>
  </defs>

  <!-- ================= LEFT: the circle ================= -->
  <text x="16" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8b96a5">1 &#183; the object turns through &#952;</text>

  <circle cx="92" cy="150" r="56" fill="none" stroke="#8b96a5" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="92" cy="150" r="2.5" fill="#8b96a5"/>
  <text x="92" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">C</text>

  <!-- O at 150deg: (92 + 56cos150, 150 - 56sin150) = (43.5, 122) ; P at 90deg: (92, 94) -->
  <line x1="92" y1="150" x2="43.5" y2="122" stroke="#8b96a5" stroke-width="1"/>
  <line x1="92" y1="150" x2="92" y2="94" stroke="#8b96a5" stroke-width="1"/>
  <text x="60" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">r</text>
  <text x="97" y="126" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">r</text>

  <!-- angle theta at C: between CO (dir 150deg) and CP (dir 90deg) -->
  <path d="M92 128 A22 22 0 0 0 73 139" fill="none" stroke="#8b96a5" stroke-width="1.1"/>
  <text x="80" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b96a5">&#952;</text>

  <circle cx="43.5" cy="122" r="3" fill="#e6edf3" stroke="#16213e" stroke-width="1"/>
  <text x="36" y="118" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">O</text>
  <circle cx="92" cy="94" r="3" fill="#e6edf3" stroke="#16213e" stroke-width="1"/>
  <text x="96" y="88" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">P</text>

  <!-- v at O: tangent forward (CCW). CO unit ~(-0.866,-0.5); forward tangent = (0.5,-0.866) -->
  <line x1="43.5" y1="122" x2="60" y2="93.4" stroke="#3fb950" stroke-width="2.4" marker-end="url(#cd-green)"/>
  <text x="43" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" font-style="italic" fill="#3fb950">v</text>
  <!-- v at P: tangent forward = (1,0) -->
  <line x1="92" y1="94" x2="126" y2="94" stroke="#3fb950" stroke-width="2.4" marker-end="url(#cd-green)"/>
  <text x="131" y="92" font-family="system-ui, sans-serif" font-size="11" font-weight="700" font-style="italic" fill="#3fb950">v</text>

  <line x1="162" y1="10" x2="162" y2="248" stroke="#8b96a5" stroke-width="0.7" stroke-opacity="0.4"/>

  <!-- ================= RIGHT: similar triangles + algebra ================= -->
  <text x="176" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8b96a5">2 &#183; two isosceles triangles, same apex angle &#952;</text>

  <!-- velocity triangle: apex (232,34), half-angle ~26deg, side 60 -> feet (206,88) and (258,88) -->
  <line x1="232" y1="34" x2="206" y2="88" stroke="#3fb950" stroke-width="2.2" marker-end="url(#cd-green)"/>
  <line x1="232" y1="34" x2="258" y2="88" stroke="#3fb950" stroke-width="2.2" marker-end="url(#cd-green)"/>
  <line x1="206" y1="88" x2="258" y2="88" stroke="#d29922" stroke-width="2.6" marker-end="url(#cd-amber)"/>
  <text x="205" y="58" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="700" font-style="italic" fill="#3fb950">v</text>
  <text x="260" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" font-style="italic" fill="#3fb950">v</text>
  <text x="232" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d29922">&#916;v</text>
  <text x="232" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">&#952;</text>

  <!-- position triangle: apex (360,34), feet (334,88) and (386,88) -->
  <line x1="360" y1="34" x2="334" y2="88" stroke="#8b96a5" stroke-width="2"/>
  <line x1="360" y1="34" x2="386" y2="88" stroke="#8b96a5" stroke-width="2"/>
  <line x1="334" y1="88" x2="386" y2="88" stroke="#8b96a5" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="333" y="58" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">r</text>
  <text x="388" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">r</text>
  <text x="360" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">&#8776; v&#8201;&#916;t</text>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">&#952;</text>

  <!-- algebra chain -->
  <text x="176" y="140" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">similar &#8658;</text>
  <text x="240" y="141" font-family="Cambria, Georgia, serif" font-size="14" font-style="italic" font-weight="600" fill="#8b96a5">&#916;v / v = v&#8201;&#916;t / r</text>

  <text x="176" y="170" font-family="system-ui, sans-serif" font-size="10.5" fill="#8b96a5">rearrange &#8658;</text>
  <text x="240" y="171" font-family="Cambria, Georgia, serif" font-size="14" font-style="italic" font-weight="600" fill="#8b96a5">&#916;v / &#916;t = v&#178; / r</text>

  <rect x="210" y="188" width="176" height="32" rx="5" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-width="1.3"/>
  <text x="298" y="209" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="16" font-style="italic" fill="#3fb950">a<tspan font-size="10" dy="3">c</tspan><tspan dy="-3"> = v&#178; / r</tspan></text>
  <text x="298" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">as &#952; &#8594; 0, &#916;v points straight at the centre C</text>
</svg>
