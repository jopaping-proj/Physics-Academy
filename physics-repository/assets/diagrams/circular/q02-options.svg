<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 126" role="img"
     aria-label="Four candidate top-view free-body diagrams of a puck moving in a circle on a string, with the centre of the circle to the left. Diagram A: the string tension pointing inward, plus a second separate arrow labelled F sub c also pointing inward. Diagram B: only the string tension, pointing inward. Diagram C: the string tension inward and an equal centrifugal-force arrow pointing outward. Diagram D: only one arrow, pointing outward.">
  <defs>
    <marker id="q2-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="q2-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
    <marker id="q2-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
  <text x="194" y="12" text-anchor="middle" font-size="9" fill="#8b96a5">the centre of the circle is to the left &#8592;</text>

  <!-- dividers -->
  <line x1="97" y1="20" x2="97" y2="120" stroke="#8b96a5" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="194" y1="20" x2="194" y2="120" stroke="#8b96a5" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="291" y1="20" x2="291" y2="120" stroke="#8b96a5" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- A: tension inward + a fake separate F_c inward -->
  <text x="12" y="34" font-size="11" font-weight="700" fill="#8b96a5">A</text>
  <circle cx="66" cy="66" r="5" fill="#e6edf3" stroke="#16213e" stroke-width="1.2"/>
  <line x1="61" y1="62" x2="30" y2="62" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#q2-blue)"/>
  <text x="46" y="53" text-anchor="middle" font-size="9" font-weight="700" fill="#58a6ff">F<tspan font-size="6.5" dy="1.5">T</tspan></text>
  <line x1="61" y1="74" x2="30" y2="74" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#q2-blue)"/>
  <text x="46" y="90" text-anchor="middle" font-size="9" font-weight="700" fill="#58a6ff">F<tspan font-size="6.5" dy="1.5">c</tspan></text>

  <!-- B: tension inward only (correct) -->
  <text x="109" y="34" font-size="11" font-weight="700" fill="#8b96a5">B</text>
  <circle cx="163" cy="66" r="5" fill="#e6edf3" stroke="#16213e" stroke-width="1.2"/>
  <line x1="158" y1="66" x2="124" y2="66" stroke="#58a6ff" stroke-width="2.6" marker-end="url(#q2-blue)"/>
  <text x="142" y="57" text-anchor="middle" font-size="9" font-weight="700" fill="#58a6ff">F<tspan font-size="6.5" dy="1.5">T</tspan></text>

  <!-- C: tension inward + centrifugal outward -->
  <text x="206" y="34" font-size="11" font-weight="700" fill="#8b96a5">C</text>
  <circle cx="242" cy="66" r="5" fill="#e6edf3" stroke="#16213e" stroke-width="1.2"/>
  <line x1="237" y1="66" x2="210" y2="66" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#q2-blue)"/>
  <text x="222" y="57" text-anchor="middle" font-size="9" font-weight="700" fill="#58a6ff">F<tspan font-size="6.5" dy="1.5">T</tspan></text>
  <line x1="247" y1="66" x2="274" y2="66" stroke="#f85149" stroke-width="2.4" marker-end="url(#q2-red)"/>
  <text x="262" y="84" text-anchor="middle" font-size="8" font-weight="700" fill="#f85149">centrifugal</text>

  <!-- D: outward only -->
  <text x="303" y="34" font-size="11" font-weight="700" fill="#8b96a5">D</text>
  <circle cx="331" cy="66" r="5" fill="#e6edf3" stroke="#16213e" stroke-width="1.2"/>
  <line x1="336" y1="66" x2="366" y2="66" stroke="#f85149" stroke-width="2.4" marker-end="url(#q2-red)"/>
  <text x="351" y="57" text-anchor="middle" font-size="8.5" font-weight="700" fill="#f85149">outward</text>
  </g>
</svg>
