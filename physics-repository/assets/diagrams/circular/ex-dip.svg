<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" role="img"
     aria-label="Side view of a rider at the bottom of a dip in the track. The rider is a dot. Both force arrows start at the dot: the seat's normal force points straight up and is the longer arrow; gravity points straight down and is shorter. The net force is upward, toward the centre of the dip which is above.">
  <defs>
    <marker id="ed-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="ed-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>
  <path d="M12 52 Q 75 146 138 52" fill="none" stroke="#8b96a5" stroke-width="1.4"/>
  <circle cx="75" cy="100" r="5" fill="#e6edf3" stroke="#16213e" stroke-width="1.3"/>
  <!-- normal force: from the dot, straight up, longer -->
  <line x1="75" y1="95" x2="75" y2="44" stroke="#58a6ff" stroke-width="2.6" marker-end="url(#ed-blue)"/>
  <text x="82" y="50" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#58a6ff">F<tspan font-size="7" dy="2">N</tspan></text>
  <!-- gravity: from the dot, straight down, shorter -->
  <line x1="75" y1="105" x2="75" y2="128" stroke="#8b96a5" stroke-width="2.3" marker-end="url(#ed-grey)"/>
  <text x="82" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8b96a5">mg</text>
  <text x="75" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#8b96a5">net force up = toward the centre</text>
</svg>
