<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" role="img"
     aria-label="Top-down view of a puck that was moving along a circular path when its string broke. From the break point it travels in a straight line, tangent to the circle, at constant speed. It does not curve outward: once the string is gone, no horizontal force acts on it, so by Newton's first law it goes straight.">
  <defs>
    <marker id="cm2-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#3fb950"/></marker>
  </defs>

  <!-- the circular path it used to follow -->
  <circle cx="160" cy="150" r="66" fill="none" stroke="#8b96a5" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="160" cy="150" r="3" fill="#8b96a5"/>

  <!-- snapped string: a short frayed stub reaching out from the centre -->
  <path d="M160 150 L182 112" stroke="#8b96a5" stroke-width="1.2" fill="none"/>
  <path d="M182 112 l5 -2 m-5 2 l-2 -5 m2 5 l4 1" stroke="#8b96a5" stroke-width="1" fill="none"/>

  <!-- break point on the circle (upper right) -->
  <circle cx="193" cy="93" r="6" fill="#e6edf3" stroke="#16213e" stroke-width="1.5"/>

  <!-- straight tangent path after the break: perpendicular to the radius (33,-57), heading down-right -->
  <line x1="193" y1="93" x2="275" y2="140" stroke="#3fb950" stroke-width="2.5" marker-end="url(#cm2-green)"/>
  <text x="283" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#3fb950">v</text>

  <text x="180" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">string snaps &#8594; straight line, constant speed</text>
</svg>
