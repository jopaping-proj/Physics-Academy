<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 236" role="img"
     aria-label="Box free-body diagram of a cart on a level track. Every force arrow starts at the box: weight points down from the centre, the normal force points up from the bottom surface, and the applied force points right, starting at the box's back (left) surface.">
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/>
    </marker>
  </defs>

  <!-- ground -->
  <line x1="34" y1="168" x2="288" y2="168" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2">
    <line x1="46" y1="168" x2="38" y2="178"/><line x1="66" y1="168" x2="58" y2="178"/>
    <line x1="86" y1="168" x2="78" y2="178"/><line x1="106" y1="168" x2="98" y2="178"/>
    <line x1="126" y1="168" x2="118" y2="178"/><line x1="146" y1="168" x2="138" y2="178"/>
    <line x1="166" y1="168" x2="158" y2="178"/><line x1="186" y1="168" x2="178" y2="178"/>
    <line x1="206" y1="168" x2="198" y2="178"/><line x1="226" y1="168" x2="218" y2="178"/>
    <line x1="246" y1="168" x2="238" y2="178"/><line x1="266" y1="168" x2="258" y2="178"/>
  </g>

  <!-- the object as a box (fill kept faint so arrows read through it) -->
  <rect x="110" y="122" width="62" height="46" rx="3" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="141" cy="145" r="2.5" fill="#e6edf3"/>

  <!-- weight: starts at the centre, points down -->
  <line x1="138" y1="145" x2="138" y2="216" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#ah-grey)"/>
  <text x="116" y="210" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="124" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <!-- normal force: starts at the bottom surface, points up -->
  <line x1="154" y1="168" x2="154" y2="56" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="160" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="168" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>

  <!-- applied force: starts at the back (left) surface, points right -->
  <line x1="111" y1="134" x2="272" y2="134" stroke="#f0c27a" stroke-width="2.5" marker-end="url(#ah-amber)"/>
  <text x="210" y="126" font-family="system-ui, sans-serif" font-size="13" fill="#f0c27a">F</text>
  <text x="218" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#f0c27a">app</text>
</svg>
