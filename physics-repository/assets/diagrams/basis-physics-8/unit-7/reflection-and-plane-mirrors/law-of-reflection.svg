<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">The law of reflection at a plane mirror</title>
<desc id="d">An incident ray strikes a horizontal mirror. The normal is drawn perpendicular to the mirror at the point of incidence. The angle of incidence, between the incident ray and the normal, equals the angle of reflection, between the reflected ray and the normal.</desc>
<rect width="520" height="300" fill="white"/>
<defs><marker id="r7" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/></marker></defs>
<g font-family="Arial" fill="#111827" font-size="12">
 <rect x="40" y="220" width="440" height="14" fill="#d5dbe3" stroke="#5b6675" stroke-width="1"/>
 <line x1="40" y1="220" x2="480" y2="220" stroke="#111827" stroke-width="2"/>
 <text x="470" y="252" text-anchor="end" fill="#5b6675">mirror</text>

 <line x1="260" y1="55" x2="260" y2="220" stroke="#5b6675" stroke-width="1.5" stroke-dasharray="6 4"/>
 <text x="260" y="46" text-anchor="middle" fill="#5b6675">normal</text>

 <line x1="110" y1="60" x2="256" y2="217" stroke="#1769aa" stroke-width="2.5" marker-end="url(#r7)"/>
 <text x="120" y="70" fill="#1769aa">incident ray</text>

 <line x1="264" y1="217" x2="410" y2="60" stroke="#1769aa" stroke-width="2.5" marker-end="url(#r7)"/>
 <text x="400" y="70" text-anchor="end" fill="#1769aa">reflected ray</text>

 <path d="M260,180 A40,40 0 0,1 232,155" fill="none" stroke="#e07b00" stroke-width="1.5"/>
 <text x="222" y="180" text-anchor="end" fill="#b35f00">angle of</text>
 <text x="222" y="194" text-anchor="end" fill="#b35f00">incidence</text>

 <path d="M260,180 A40,40 0 0,0 288,155" fill="none" stroke="#e07b00" stroke-width="1.5"/>
 <text x="298" y="180" fill="#b35f00">angle of</text>
 <text x="298" y="194" fill="#b35f00">reflection</text>

 <text x="260" y="280" text-anchor="middle" fill="#1a7f37" font-weight="bold">angle of incidence = angle of reflection  (both from the normal)</text>
</g>
</svg>
