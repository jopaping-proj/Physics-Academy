<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-labelledby="t d">
<title id="t">Standard circuit diagram symbols</title>
<desc id="d">Six standard circuit symbols. A cell is a long thin line beside a short thick line. A battery is two cell symbols in a row. A bulb is a circle with a cross inside. A resistor is a plain rectangle. A switch is a break in the wire with a hinged lever. A connecting wire is a plain straight line.</desc>
<rect width="560" height="240" fill="white"/>
<g font-family="Arial" fill="#111827" font-size="12" stroke="#111827">
 <!-- cell -->
 <line x1="40" y1="50" x2="70" y2="50" stroke-width="2" fill="none"/>
 <line x1="70" y1="36" x2="70" y2="64" stroke-width="2"/>
 <line x1="80" y1="42" x2="80" y2="58" stroke-width="5"/>
 <line x1="80" y1="50" x2="110" y2="50" stroke-width="2"/>
 <text x="75" y="90" text-anchor="middle" stroke="none" fill="#5b6675">cell</text>

 <!-- battery -->
 <line x1="200" y1="50" x2="222" y2="50" stroke-width="2"/>
 <line x1="222" y1="36" x2="222" y2="64" stroke-width="2"/>
 <line x1="230" y1="42" x2="230" y2="58" stroke-width="5"/>
 <line x1="238" y1="36" x2="238" y2="64" stroke-width="2"/>
 <line x1="246" y1="42" x2="246" y2="58" stroke-width="5"/>
 <line x1="246" y1="50" x2="268" y2="50" stroke-width="2"/>
 <text x="234" y="90" text-anchor="middle" stroke="none" fill="#5b6675">battery</text>

 <!-- bulb -->
 <line x1="380" y1="50" x2="400" y2="50" stroke-width="2"/>
 <circle cx="418" cy="50" r="18" fill="none" stroke-width="2"/>
 <line x1="405" y1="37" x2="431" y2="63" stroke-width="2"/>
 <line x1="431" y1="37" x2="405" y2="63" stroke-width="2"/>
 <line x1="436" y1="50" x2="456" y2="50" stroke-width="2"/>
 <text x="418" y="90" text-anchor="middle" stroke="none" fill="#5b6675">bulb (lamp)</text>

 <!-- resistor -->
 <line x1="40" y1="160" x2="70" y2="160" stroke-width="2"/>
 <rect x="70" y="150" width="50" height="20" fill="none" stroke-width="2"/>
 <line x1="120" y1="160" x2="150" y2="160" stroke-width="2"/>
 <text x="95" y="200" text-anchor="middle" stroke="none" fill="#5b6675">resistor</text>

 <!-- switch -->
 <line x1="200" y1="160" x2="228" y2="160" stroke-width="2"/>
 <circle cx="228" cy="160" r="3" fill="#111827"/>
 <line x1="228" y1="160" x2="256" y2="144" stroke-width="2"/>
 <circle cx="262" cy="160" r="3" fill="#111827"/>
 <line x1="262" y1="160" x2="290" y2="160" stroke-width="2"/>
 <text x="245" y="200" text-anchor="middle" stroke="none" fill="#5b6675">switch (open)</text>

 <!-- wire -->
 <line x1="380" y1="160" x2="456" y2="160" stroke-width="2"/>
 <text x="418" y="200" text-anchor="middle" stroke="none" fill="#5b6675">connecting wire</text>
</g>
</svg>
