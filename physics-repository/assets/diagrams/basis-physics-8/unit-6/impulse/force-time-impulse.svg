<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="t d">
<title id="t">Impulse as the area under a force versus time graph</title>
<desc id="d">A force versus time graph for a collision. The force rises from zero to a peak and falls back to zero, forming a curved hump. The shaded area between the curve and the time axis is the impulse, which equals the change in momentum. A dashed horizontal line marks the average force, whose rectangle over the same time has the same area.</desc>
<rect width="560" height="320" fill="white"/>
<g font-family="Arial" fill="#111827" font-size="12">
 <line x1="70" y1="40" x2="70" y2="260" stroke="#111827" stroke-width="2"/>
 <line x1="70" y1="260" x2="510" y2="260" stroke="#111827" stroke-width="2"/>
 <text x="30" y="150" text-anchor="middle" fill="#5b6675" transform="rotate(-90 30 150)">Force</text>
 <text x="290" y="298" text-anchor="middle" fill="#5b6675">Time</text>

 <path d="M110,260 C170,260 180,90 250,90 C320,90 330,260 410,260 Z" fill="#dbe8f3" stroke="#1769aa" stroke-width="2.5"/>

 <line x1="70" y1="150" x2="440" y2="150" stroke="#5b6675" stroke-width="1.5" stroke-dasharray="6 4"/>
 <text x="446" y="154" fill="#5b6675" font-size="11">average force</text>

 <text x="250" y="200" text-anchor="middle" fill="#0f3d61" font-weight="bold">area = impulse</text>
 <text x="250" y="218" text-anchor="middle" fill="#5b6675" font-size="11">J = F&#916;t = change in momentum</text>

 <line x1="110" y1="260" x2="110" y2="266" stroke="#111827"/>
 <line x1="410" y1="260" x2="410" y2="266" stroke="#111827"/>
 <text x="110" y="280" text-anchor="middle" font-size="11" fill="#5b6675">start</text>
 <text x="410" y="280" text-anchor="middle" font-size="11" fill="#5b6675">end of contact</text>
</g>
</svg>
