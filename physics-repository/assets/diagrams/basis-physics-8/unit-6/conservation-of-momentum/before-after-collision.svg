<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="t d">
<title id="t">Total momentum before and after a collision is the same</title>
<desc id="d">Before: a 2 kg cart moves right at 6 metres per second (momentum 12) toward a stationary 4 kg cart (momentum 0); total momentum 12 to the right. After: the carts have coupled and move right together at 2 metres per second; combined mass 6 kg, momentum 12. The total momentum is 12 kg metres per second to the right in both cases.</desc>
<rect width="600" height="320" fill="white"/>
<defs><marker id="mv" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/></marker></defs>
<g font-family="Arial" fill="#111827" font-size="12">
 <text x="40" y="28" font-size="13" font-weight="bold">Before</text>
 <line x1="40" y1="110" x2="560" y2="110" stroke="#5b6675" stroke-width="2"/>
 <rect x="90" y="82" width="40" height="28" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <text x="110" y="74" text-anchor="middle" font-size="11">2 kg</text>
 <line x1="135" y1="96" x2="200" y2="96" stroke="#1769aa" stroke-width="3" marker-end="url(#mv)"/>
 <text x="168" y="128" text-anchor="middle" font-size="11" fill="#1769aa">6 m/s</text>
 <rect x="300" y="78" width="56" height="32" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <text x="328" y="70" text-anchor="middle" font-size="11">4 kg</text>
 <text x="328" y="128" text-anchor="middle" font-size="11" fill="#5b6675">at rest</text>
 <text x="470" y="96" font-size="12" fill="#0f3d61">p = 12 + 0 = 12 &#8594;</text>

 <line x1="40" y1="170" x2="560" y2="170" stroke="#d5dbe3" stroke-width="1"/>

 <text x="40" y="210" font-size="13" font-weight="bold">After</text>
 <line x1="40" y1="270" x2="560" y2="270" stroke="#5b6675" stroke-width="2"/>
 <rect x="250" y="238" width="40" height="32" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <rect x="290" y="234" width="56" height="36" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <text x="298" y="226" text-anchor="middle" font-size="11">6 kg coupled</text>
 <line x1="350" y1="252" x2="395" y2="252" stroke="#1769aa" stroke-width="3" marker-end="url(#mv)"/>
 <text x="372" y="288" text-anchor="middle" font-size="11" fill="#1769aa">2 m/s</text>
 <text x="470" y="252" font-size="12" fill="#0f3d61">p = 6 x 2 = 12 &#8594;</text>

 <text x="300" y="312" text-anchor="middle" font-size="11" fill="#1a7f37">Total momentum is 12 kg&#183;m/s to the right before and after (closed system).</text>
</g>
</svg>
