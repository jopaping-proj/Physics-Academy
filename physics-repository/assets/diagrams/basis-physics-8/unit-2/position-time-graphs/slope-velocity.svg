<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-labelledby="t2 d2">
<title id="t2">Position-time graph with two slope triangles</title>
<desc id="d2">A straight line rises from the origin to plus 8 metres at 2 seconds, then a second straight line falls to plus 2 metres at 5 seconds. The first slope is plus 4 metres per second; the second slope is minus 2 metres per second.</desc>
<rect width="620" height="360" fill="white"/>
<g stroke="#d5dbe3" stroke-width="1">
<path d="M80 40V320M160 40V320M240 40V320M320 40V320M400 40V320M480 40V320M560 40V320"/>
<path d="M80 69H560M80 127H560M80 185H560M80 243H560M80 301H560"/>
</g>
<g stroke="#111827" stroke-width="2">
<path d="M80 40V330"/>
<path d="M70 301H600"/>
</g>
<g fill="#111827" font-family="Arial" font-size="15">
<text x="322" y="352">t (s)</text>
<text x="26" y="34">x (m)</text>
</g>
<g fill="#111827" font-family="Arial" font-size="13" text-anchor="middle">
<text x="80" y="319">0</text><text x="240" y="319">2</text><text x="400" y="319">4</text><text x="560" y="319">6</text>
</g>
<g fill="#111827" font-family="Arial" font-size="13" text-anchor="end">
<text x="72" y="74">8</text><text x="72" y="132">6</text><text x="72" y="190">4</text><text x="72" y="248">2</text>
</g>
<g stroke="#e07b00" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
<path d="M80 301H240V69"/>
<path d="M240 69H480V243"/>
</g>
<g fill="#b35f00" font-family="Arial" font-size="13">
<text x="118" y="316">Δt = 2 s</text>
<text x="250" y="192">Δx = +8 m</text>
<text x="322" y="60">Δt = 3 s</text>
<text x="488" y="168">Δx = −6 m</text>
</g>
<polyline points="80,301 240,69 480,243" fill="none" stroke="#1769aa" stroke-width="4" stroke-linejoin="round"/>
<g fill="#1769aa"><circle cx="80" cy="301" r="5"/><circle cx="240" cy="69" r="5"/><circle cx="480" cy="243" r="5"/></g>
<g font-family="Arial" font-size="13" font-weight="bold" fill="#1769aa">
<text x="98" y="150">v = +4 m/s</text>
<text x="300" y="214">v = −2 m/s</text>
</g>
</svg>
