<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" role="img" aria-labelledby="t d"><title id="t">Position number line</title><desc id="d">Position axis from negative eight to positive eight metres. A is negative four, B positive three, C positive four.</desc><line x1="55" y1="90" x2="665" y2="90" stroke="#111" stroke-width="3"/><polygon points="665,82 682,90 665,98" fill="#111"/><text x="500" y="45" font-family="Arial" font-size="18">positive direction</text><text x="690" y="97" font-family="Arial" font-size="18">x</text><g font-family="Arial" font-size="15" text-anchor="middle"><text x="55" y="122">-8</text><text x="210" y="122">-4</text><text x="365" y="122">0</text><text x="481" y="122">+3</text><text x="520" y="122">+4</text><text x="210" y="68">A</text><text x="481" y="68">B</text><text x="520" y="68">C</text></g><g stroke="#111" stroke-width="2"><path d="M55 82v16M210 82v16M365 82v16M481 82v16M520 82v16" fill="none"/></g><text x="335" y="155" font-family="Arial" font-size="17">position (m)</text></svg>
