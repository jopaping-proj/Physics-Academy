<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d"><title id="t">Velocity-time graph with constant and changing segments</title><desc id="d">Velocity is positive four from zero to three seconds, changes linearly to negative four at four seconds, stays negative four to seven seconds, changes to positive two at eight seconds, and stays positive two to ten seconds.</desc><g stroke="#d5dbe3"><path d="M90 60V320M255 60V320M310 60V320M475 60V320M530 60V320M640 60V320"/><path d="M90 90H640M90 190H640M90 290H640"/></g><g stroke="#111827" stroke-width="3"><path d="M90 190H680"/><path d="M90 335V45"/></g><polyline points="90,90 255,90 310,290 475,290 530,140 640,140" fill="none" stroke="#1769aa" stroke-width="5"/><g font-family="Arial" font-size="16"><text x="165" y="78">A</text><text x="385" y="278">B</text><text x="580" y="128">C</text><text x="330" y="370">time, t (s)</text><text x="12" y="28">velocity, v (m/s)</text><text x="82" y="96" text-anchor="end">+4</text><text x="82" y="146" text-anchor="end">+2</text><text x="82" y="296" text-anchor="end">-4</text><text x="85" y="352">0</text><text x="250" y="352">3</text><text x="305" y="352">4</text><text x="470" y="352">7</text><text x="525" y="352">8</text><text x="633" y="352">10</text></g></svg>
