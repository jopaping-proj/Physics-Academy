<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="t d">
<title id="t">Velocity-time graph for a ball thrown straight up</title>
<desc id="d">A single straight line falls from plus 19.6 metres per second at 0 seconds, through zero at 2 seconds (the top of the flight), to minus 19.6 metres per second at 4 seconds. The slope is a constant minus 9.8 metres per second squared, unchanged through the zero crossing.</desc>
<rect width="640" height="380" fill="white"/>
<g stroke="#d5dbe3" stroke-width="1">
<path d="M80 40V300M190 40V300M300 40V300M410 40V300M520 40V300"/>
<path d="M80 80H540M80 130H540M80 180H540M80 230H540M80 280H540"/>
</g>
<g stroke="#111827" stroke-width="2">
<path d="M80 40V320"/>
<path d="M70 180H560"/>
</g>
<g fill="#111827" font-family="Arial" font-size="13">
<text x="315" y="352" text-anchor="middle">t (s)</text>
<text x="24" y="34">v (m/s)</text>
</g>
<g fill="#111827" font-family="Arial" font-size="12" text-anchor="middle">
<text x="80" y="298">0</text><text x="190" y="298">1</text><text x="300" y="298">2</text><text x="410" y="298">3</text><text x="520" y="298">4</text>
</g>
<g fill="#111827" font-family="Arial" font-size="12" text-anchor="end">
<text x="72" y="84">+19.6</text><text x="72" y="184">0</text><text x="72" y="284">&#8722;19.6</text>
</g>
<polyline points="80,80 520,280" fill="none" stroke="#1769aa" stroke-width="4"/>
<circle cx="300" cy="180" r="5" fill="#c0392b"/>
<path d="M336 128L308 172" stroke="#c0392b" stroke-width="1"/>
<text x="340" y="124" font-family="Arial" font-size="12" fill="#c0392b">top of flight: v = 0,</text>
<text x="340" y="140" font-family="Arial" font-size="12" fill="#c0392b">but a is still &#8722;9.8 m/s&#178;</text>
<text x="92" y="250" font-family="Arial" font-size="13" font-weight="bold" fill="#1769aa">constant slope = &#8722;9.8 m/s&#178;</text>
<text x="92" y="270" font-family="Arial" font-size="12" fill="#5b6675">one straight line &#8212; it does not flatten at the crossing</text>
</svg>
