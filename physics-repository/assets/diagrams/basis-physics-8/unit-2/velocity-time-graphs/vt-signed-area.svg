<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-labelledby="t d">
<title id="t">Velocity-time graph: signed area as displacement</title>
<desc id="d">Velocity is plus 5 metres per second from 0 to 2 seconds, then minus 3 metres per second from 2 to 6 seconds. The area above the time axis is plus 10 metres; the area below is minus 12 metres; the net displacement is minus 2 metres.</desc>
<rect width="620" height="360" fill="white"/>
<g stroke="#d5dbe3" stroke-width="1">
<path d="M70 40V300M145 40V300M220 40V300M295 40V300M370 40V300M445 40V300M520 40V300"/>
<path d="M70 90H520M70 140H520M70 190H520M70 240H520"/>
</g>
<path d="M70 190H220V90H70Z" fill="#1a7f37" fill-opacity="0.16"/>
<path d="M220 190H520V280H220Z" fill="#c0392b" fill-opacity="0.14"/>
<g stroke="#111827" stroke-width="2">
<path d="M70 40V300"/>
<path d="M60 190H545"/>
</g>
<g fill="#111827" font-family="Arial" font-size="13">
<text x="300" y="336" text-anchor="middle">t (s)</text>
<text x="24" y="34">v (m/s)</text>
</g>
<g fill="#111827" font-family="Arial" font-size="12" text-anchor="middle">
<text x="70" y="316">0</text><text x="220" y="316">2</text><text x="370" y="316">4</text><text x="520" y="316">6</text>
</g>
<g fill="#111827" font-family="Arial" font-size="12" text-anchor="end">
<text x="62" y="94">+5</text><text x="62" y="194">0</text><text x="62" y="284">&#8722;3</text>
</g>
<polyline points="70,90 220,90 220,280 520,280" fill="none" stroke="#1769aa" stroke-width="4" stroke-linejoin="round"/>
<text x="120" y="150" font-family="Arial" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">+10 m</text>
<text x="370" y="240" font-family="Arial" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">&#8722;12 m</text>
<text x="360" y="120" font-family="Arial" font-size="13" font-weight="bold" fill="#111827">net &#916;x = (+10) + (&#8722;12) = &#8722;2 m</text>
</svg>
