<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-labelledby="t d">
<title id="t">Acceleration-time graph: area is the change in velocity</title>
<desc id="d">Acceleration is constant at plus 2 metres per second squared from 0 to 4 seconds. The shaded rectangular area is plus 8 metres per second, which is the change in velocity, not the final velocity.</desc>
<rect width="620" height="340" fill="white"/>
<g stroke="#d5dbe3" stroke-width="1">
<path d="M70 40V250M180 40V250M290 40V250M400 40V250M510 40V250"/>
<path d="M70 90H510M70 140H510M70 190H510"/>
</g>
<path d="M70 190H290V90H70Z" fill="#1a7f37" fill-opacity="0.16"/>
<g stroke="#111827" stroke-width="2">
<path d="M70 40V260"/>
<path d="M60 190H540"/>
</g>
<g fill="#111827" font-family="Arial" font-size="13">
<text x="300" y="278" text-anchor="middle">t (s)</text>
<text x="20" y="34">a (m/s&#178;)</text>
</g>
<g fill="#111827" font-family="Arial" font-size="12" text-anchor="middle">
<text x="70" y="209">0</text><text x="180" y="209">2</text><text x="290" y="209">4</text><text x="400" y="209">6</text>
</g>
<g fill="#111827" font-family="Arial" font-size="12" text-anchor="end">
<text x="62" y="94">+2</text><text x="62" y="194">0</text>
</g>
<polyline points="70,90 290,90" fill="none" stroke="#1769aa" stroke-width="4"/>
<text x="180" y="135" font-family="Arial" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">area = &#916;v</text>
<text x="180" y="155" font-family="Arial" font-size="12" fill="#1a7f37" text-anchor="middle">(+2)(4) = +8 m/s</text>
<text x="330" y="118" font-family="Arial" font-size="12" fill="#5b6675">&#916;v is a <tspan font-style="italic">change</tspan> in velocity,</text>
<text x="330" y="134" font-family="Arial" font-size="12" fill="#5b6675">not the final velocity by itself.</text>
</svg>
