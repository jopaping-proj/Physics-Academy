<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Free-fall acceleration-time graph</title><desc id="d">An acceleration-time graph for a ball in free fall, showing a single flat segment at -9.8 m/s^2 for the entire interval, including through the moment the velocity is zero.</desc><rect width="800" height="450" fill="white"/><g stroke="#d5dbe3" stroke-width="1"><line x1="70" y1="40" x2="70" y2="390"/><line x1="157.5" y1="40" x2="157.5" y2="390"/><line x1="245" y1="40" x2="245" y2="390"/><line x1="332.5" y1="40" x2="332.5" y2="390"/><line x1="420" y1="40" x2="420" y2="390"/><line x1="507.5" y1="40" x2="507.5" y2="390"/><line x1="595" y1="40" x2="595" y2="390"/><line x1="682.5" y1="40" x2="682.5" y2="390"/><line x1="770" y1="40" x2="770" y2="390"/><line x1="70" y1="390" x2="770" y2="390"/><line x1="70" y1="340" x2="770" y2="340"/><line x1="70" y1="290" x2="770" y2="290"/><line x1="70" y1="240" x2="770" y2="240"/><line x1="70" y1="190" x2="770" y2="190"/><line x1="70" y1="140" x2="770" y2="140"/><line x1="70" y1="90" x2="770" y2="90"/><line x1="70" y1="40" x2="770" y2="40"/></g><line x1="70" y1="90" x2="770" y2="90" stroke="#111" stroke-width="2"/><line x1="70" y1="40" x2="70" y2="390" stroke="#111" stroke-width="2"/><g font-family="Arial" font-size="13" fill="#111827"><text x="70" y="410" text-anchor="middle">0</text><text x="157.5" y="410" text-anchor="middle">0.5</text><text x="245" y="410" text-anchor="middle">1</text><text x="332.5" y="410" text-anchor="middle">1.5</text><text x="420" y="410" text-anchor="middle">2</text><text x="507.5" y="410" text-anchor="middle">2.5</text><text x="595" y="410" text-anchor="middle">3</text><text x="682.5" y="410" text-anchor="middle">3.5</text><text x="770" y="410" text-anchor="middle">4</text><text x="60" y="394" text-anchor="end">-12</text><text x="60" y="344" text-anchor="end">-10</text><text x="60" y="294" text-anchor="end">-8</text><text x="60" y="244" text-anchor="end">-6</text><text x="60" y="194" text-anchor="end">-4</text><text x="60" y="144" text-anchor="end">-2</text><text x="60" y="94" text-anchor="end">0</text><text x="60" y="44" text-anchor="end">2</text></g><text x="420" y="438" font-family="Arial" font-size="14" fill="#111" text-anchor="middle">time (s)</text><text x="18" y="215" font-family="Arial" font-size="14" fill="#111" text-anchor="middle" transform="rotate(-90 18 215)">acceleration (m/s²)</text><g stroke="#1769aa" stroke-width="3.5" fill="none"><line x1="70" y1="335" x2="770" y2="335"/></g><circle cx="70" cy="335" r="5.5" fill="#1769aa"/><text data-point-index="0" x="15" y="305" font-family="Arial" font-size="13" fill="#1769aa" text-anchor="middle">A</text><circle cx="770" cy="335" r="5.5" fill="#1769aa"/><text data-point-index="1" x="715" y="305" font-family="Arial" font-size="13" fill="#1769aa" text-anchor="middle">B</text></svg>