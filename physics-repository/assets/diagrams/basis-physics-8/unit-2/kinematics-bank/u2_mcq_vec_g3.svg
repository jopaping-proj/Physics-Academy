<svg xmlns="http://www.w3.org/2000/svg" width="500" height="360" viewBox="0 0 500 360" font-family="Helvetica, Arial">
  <rect x="0" y="0" width="500" height="360" fill="#ffffff"/>
  <!-- axes -->
  <line x1="90" y1="150" x2="470" y2="150" stroke="#888888" stroke-width="1.5"/>
  <line x1="300" y1="20" x2="300" y2="330" stroke="#888888" stroke-width="1.5"/>
  <text x="440" y="143" font-size="14" fill="#5b6675">+x</text>
  <text x="98" y="143" font-size="14" fill="#5b6675">-x</text>
  <text x="308" y="34" font-size="14" fill="#5b6675">+y</text>
  <text x="308" y="322" font-size="14" fill="#5b6675">-y</text>
  <text x="306" y="135" font-size="13" fill="#111827">O</text>
  <!-- dashed legs -->
  <line x1="300" y1="150" x2="210" y2="150" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="210" y1="150" x2="210" y2="270" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- vector -->
  <line x1="300" y1="150" x2="210" y2="270" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <!-- leg labels -->
  <text x="195" y="140" font-size="13" fill="#1f6fb2">v&#8339; = -30 m</text>
  <text x="115" y="214" font-size="13" fill="#1f6fb2">v&#8347; = -40 m</text>
  <!-- vector label -->
  <text x="112" y="255" font-size="15" fill="#1a1a1a" font-weight="bold">v = ?</text>
  <text x="120" y="300" font-size="13" fill="#666666" font-style="italic">Quadrant III</text>
</svg>
