<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="title desc">
<title id="title">Drone flight corridor number line</title>
<desc id="desc">A horizontal number line from negative six to positive twelve meters, marked at the control tower position zero, with four labeled drone positions: start at negative four, avoid obstacle at positive two, land at positive six, and pickup at positive ten. An arrow at the right end points toward the loading dock, the positive direction.</desc>
<rect width="820" height="380" fill="white"/>
<line x1="40" y1="230" x2="780" y2="230" stroke="#111" stroke-width="3" marker-end="url(#arrowhead)"/>
<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10"><circle cx="5" cy="5" r="4" fill="#1769aa"/></marker>
</defs>
<text x="600" y="215" font-family="Arial" font-size="14" fill="#111" text-anchor="middle">positive direction</text>

<!-- ticks every 2 m from -6 to +12; x = 40 + (value+6)*40 -->
<g stroke="#555" stroke-width="1.5">
<line x1="40" y1="224" x2="40" y2="236"/>
<line x1="120" y1="224" x2="120" y2="236"/>
<line x1="200" y1="224" x2="200" y2="236"/>
<line x1="280" y1="224" x2="280" y2="236"/>
<line x1="360" y1="224" x2="360" y2="236"/>
<line x1="440" y1="224" x2="440" y2="236"/>
<line x1="520" y1="224" x2="520" y2="236"/>
<line x1="600" y1="224" x2="600" y2="236"/>
<line x1="680" y1="224" x2="680" y2="236"/>
<line x1="760" y1="224" x2="760" y2="236"/>
</g>
<g font-family="Arial" font-size="14" fill="#111827" text-anchor="middle">
<text x="40" y="258">−6</text>
<text x="120" y="258">−4</text>
<text x="200" y="258">−2</text>
<text x="280" y="258">0</text>
<text x="360" y="258">+2</text>
<text x="440" y="258">+4</text>
<text x="520" y="258">+6</text>
<text x="600" y="258">+8</text>
<text x="680" y="258">+10</text>
<text x="760" y="258">+12</text>
</g>
<text x="700" y="290" font-family="Arial" font-size="14" fill="#111827" text-anchor="middle">position (m)</text>

<!-- control tower at x=0 -> screen x=280 -->
<line x1="280" y1="210" x2="280" y2="240" stroke="#7a1f1f" stroke-width="2"/>
<text x="280" y="200" font-family="Arial" font-size="14" fill="#7a1f1f" text-anchor="middle">control tower</text>

<!-- position markers -->
<!-- start x=-4 -> 120 ; near tier (short leader, label sits well clear of the line) -->
<circle cx="120" cy="230" r="6" fill="#1769aa"/>
<line x1="120" y1="223" x2="120" y2="205" stroke="#1769aa" stroke-width="1.5"/>
<text x="120" y="177" font-family="Arial" font-size="14" fill="#0d4a75" text-anchor="middle">Start</text>
<text x="120" y="195" font-family="Arial" font-size="13" fill="#0d4a75" text-anchor="middle">(−4 m)</text>

<!-- avoid obstacle x=+2 -> 360 ; far tier (taller leader, label well clear of the line) -->
<circle cx="360" cy="230" r="6" fill="#b5590f"/>
<line x1="360" y1="223" x2="360" y2="150" stroke="#b5590f" stroke-width="1.5"/>
<text x="360" y="122" font-family="Arial" font-size="14" fill="#8a4208" text-anchor="middle">Avoid obstacle</text>
<text x="360" y="140" font-family="Arial" font-size="13" fill="#8a4208" text-anchor="middle">(+2 m)</text>

<!-- land x=+6 -> 520 ; near tier -->
<circle cx="520" cy="230" r="6" fill="#227a52"/>
<line x1="520" y1="223" x2="520" y2="205" stroke="#227a52" stroke-width="1.5"/>
<text x="520" y="177" font-family="Arial" font-size="14" fill="#175c3d" text-anchor="middle">Land</text>
<text x="520" y="195" font-family="Arial" font-size="13" fill="#175c3d" text-anchor="middle">(+6 m)</text>

<!-- pickup x=+10 -> 680 ; far tier -->
<circle cx="680" cy="230" r="6" fill="#7a1fa0"/>
<line x1="680" y1="223" x2="680" y2="150" stroke="#7a1fa0" stroke-width="1.5"/>
<text x="680" y="122" font-family="Arial" font-size="14" fill="#5c1878" text-anchor="middle">Pickup</text>
<text x="680" y="140" font-family="Arial" font-size="13" fill="#5c1878" text-anchor="middle">(+10 m)</text>

<text x="410" y="345" font-family="Arial" font-size="15" fill="#111" text-anchor="middle">Order of travel: Start → Pickup → Avoid obstacle → Land</text>
</svg>
