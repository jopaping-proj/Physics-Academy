<svg xmlns="http://www.w3.org/2000/svg" width="500" height="420" viewBox="0 0 500 420" font-family="Helvetica, Arial">
  <rect x="0" y="0" width="500" height="420" fill="#ffffff"/>
  <!-- axes -->
  <line x1="90" y1="350" x2="470" y2="350" stroke="#888888" stroke-width="1.5"/>
  <line x1="300" y1="30" x2="300" y2="400" stroke="#888888" stroke-width="1.5"/>
  <text x="440" y="343" font-size="14" fill="#5b6675">+x</text>
  <text x="98" y="343" font-size="14" fill="#5b6675">-x</text>
  <text x="308" y="42" font-size="14" fill="#5b6675">+y</text>
  <text x="306" y="378" font-size="13" fill="#111827">O</text>
  <!-- dashed legs -->
  <line x1="300" y1="350" x2="300" y2="214.1" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="300" y1="214.1" x2="236.6" y2="214.1" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- angle arc (from +y axis toward vector) -->
  <path d="M 300 320 A 30 30 0 0 0 287.3 322.8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="325" font-size="14" fill="#c0392b">25&#176; from +y</text>
  <!-- vector -->
  <line x1="300" y1="350" x2="236.6" y2="214.1" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <text x="150" y="278" font-size="15" fill="#1a1a1a" font-weight="bold">v = 40 m</text>
  <!-- leg labels -->
  <text x="152" y="205" font-size="13" fill="#1f6fb2">horizontal component</text>
  <text x="308" y="290" font-size="13" fill="#1f6fb2">vertical component</text>
</svg>
