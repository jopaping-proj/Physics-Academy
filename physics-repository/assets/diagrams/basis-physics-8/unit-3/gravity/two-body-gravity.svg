<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
<title id="t">Gravitational force between two masses</title>
<desc id="d">Two spheres of different size. An arrow on each sphere points along the line joining their centres, toward the other sphere. The two arrows are equal in length, showing the pull is mutual and equal in size.</desc>
<rect width="560" height="300" fill="white"/>
<line x1="120" y1="150" x2="440" y2="150" stroke="#d5dbe3" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="120" cy="150" r="34" fill="#dbe6f2" stroke="#1769aa" stroke-width="2"/>
<circle cx="440" cy="150" r="20" fill="#dbe6f2" stroke="#1769aa" stroke-width="2"/>
<text x="120" y="155" font-family="Arial" font-size="14" fill="#0f3d61" text-anchor="middle">m&#8321;</text>
<text x="440" y="155" font-family="Arial" font-size="13" fill="#0f3d61" text-anchor="middle">m&#8322;</text>
<line x1="168" y1="150" x2="248" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
<line x1="392" y1="150" x2="312" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/></marker></defs>
<text x="208" y="132" font-family="Arial" font-size="13" fill="#c0392b" text-anchor="middle">F on m&#8321;</text>
<text x="352" y="132" font-family="Arial" font-size="13" fill="#c0392b" text-anchor="middle">F on m&#8322;</text>
<g stroke="#111827" stroke-width="1">
<path d="M120 190V222M440 178V222M120 216H440"/>
<path d="M124 212L120 216L124 220M436 212L440 216L436 220" fill="none"/>
</g>
<text x="280" y="238" font-family="Arial" font-size="13" fill="#111827" text-anchor="middle">r  (centre to centre)</text>
<text x="280" y="268" font-family="Arial" font-size="12" fill="#5b6675" text-anchor="middle">Equal and opposite: each mass pulls the other toward its own centre, with the same size force.</text>
</svg>
