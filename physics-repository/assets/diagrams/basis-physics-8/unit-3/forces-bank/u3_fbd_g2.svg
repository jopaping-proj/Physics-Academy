<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" font-family="Helvetica, Arial">
  <rect x="0" y="0" width="360" height="420" fill="#ffffff"/>
  <!-- ceiling hatch -->
  <line x1="100" y1="30" x2="260" y2="30" stroke="#333333" stroke-width="3"/>
  <!-- cable -->
  <line x1="180" y1="30" x2="180" y2="150" stroke="#555555" stroke-width="2"/>
  <!-- box -->
  <rect x="130" y="150" width="100" height="70" fill="#e8ecf3" stroke="#1a1a1a" stroke-width="2"/>
  <text x="160" y="190" font-size="14" fill="#1a1a1a">Box</text>
  <!-- weight (down) -->
  <line x1="180" y1="220" x2="180" y2="320" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed2)"/>
  <text x="188" y="300" font-size="14" fill="#c0392b" font-weight="bold">F&#8320; (weight)</text>
  <!-- tension (up) -->
  <line x1="180" y1="150" x2="180" y2="70" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#arrowBlue2)"/>
  <text x="188" y="90" font-size="14" fill="#1f6fb2" font-weight="bold">F&#7595; (tension)</text>
  <defs>
    <marker id="arrowRed2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6fb2"/>
    </marker>
  </defs>
</svg>
