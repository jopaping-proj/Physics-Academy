<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" font-family="Helvetica, Arial">
  <rect x="0" y="0" width="520" height="380" fill="#ffffff"/>
  <!-- ground -->
  <line x1="40" y1="300" x2="480" y2="300" stroke="#333333" stroke-width="2"/>
  <!-- box -->
  <rect x="210" y="230" width="100" height="70" fill="#e8ecf3" stroke="#1a1a1a" stroke-width="2"/>
  <text x="240" y="270" font-size="14" fill="#1a1a1a">Box</text>
  <!-- weight (down) -->
  <line x1="260" y1="300" x2="260" y2="365" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="266" y="350" font-size="14" fill="#c0392b" font-weight="bold">F&#8320; (weight)</text>
  <!-- normal (up) -->
  <line x1="260" y1="230" x2="260" y2="165" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="266" y="180" font-size="14" fill="#1f6fb2" font-weight="bold">F&#8345; (normal)</text>
  <!-- applied (right) -->
  <line x1="310" y1="265" x2="400" y2="265" stroke="#1a8a4a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="325" y="255" font-size="14" fill="#1a8a4a" font-weight="bold">F&#8320; (applied)</text>
  <!-- friction (left) -->
  <line x1="210" y1="265" x2="130" y2="265" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="88" y="283" font-size="14" fill="#8e44ad" font-weight="bold">F&#8347; (friction)</text>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f6fb2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a8a4a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>
