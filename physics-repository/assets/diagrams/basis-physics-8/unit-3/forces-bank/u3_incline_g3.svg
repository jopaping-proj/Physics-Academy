<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" font-family="Helvetica, Arial">
  <rect x="0" y="0" width="520" height="440" fill="#ffffff"/>
  <!-- incline triangle -->
  <polygon points="100,350 420,350 100,165.25" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2"/>
  <!-- angle arc at base vertex -->
  <path d="M 380 350 A 40 40 0 0 0 385.4 330" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="112" y="340" font-size="15" fill="#c0392b" font-weight="bold">&#952; = 30&#176;</text>
  <!-- block -->
  <circle cx="260" cy="257.6" r="6" fill="#1a1a1a"/>
  <!-- weight vector (solid, block to W) -->
  <line x1="260" y1="257.6" x2="260" y2="397.6" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="185" y="290" font-size="14" fill="#1a1a1a" font-weight="bold">F&#8320; = mg</text>
  <!-- parallel component (dashed, block to F) -->
  <line x1="260" y1="257.6" x2="320.6" y2="292.6" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="330" y="298" font-size="13" fill="#1f6fb2">mg sin&#952;</text>
  <!-- perpendicular component (dashed, F to W) -->
  <line x1="320.6" y1="292.6" x2="260" y2="397.6" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="326" y="358" font-size="13" fill="#1f6fb2">mg cos&#952;</text>
  <!-- normal force (solid, block outward) -->
  <line x1="260" y1="257.6" x2="320.6" y2="152.6" stroke="#1a8a4a" stroke-width="2.5" marker-end="url(#arrowN)"/>
  <text x="330" y="140" font-size="14" fill="#1a8a4a" font-weight="bold">F&#7480; (normal)</text>
  <!-- friction (solid, down-slope — object being pushed UP the incline, friction opposes by acting down-slope) -->
  <line x1="260" y1="257.6" x2="303.3" y2="282.6" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <text x="140" y="428" font-size="14" fill="#8e44ad" font-weight="bold">F&#7529; (friction, down-slope)</text>
  <defs>
    <marker id="arrowW" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowN" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a8a4a"/>
    </marker>
    <marker id="arrowF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>
