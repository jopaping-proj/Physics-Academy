<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">Heating curve for water heated at a constant rate from ice to steam</title>
<desc id="d">Temperature on the vertical axis, energy added on the horizontal axis. A sloped section shows ice warming to 0 degrees Celsius; a short flat plateau at 0 degrees Celsius shows melting; a sloped section shows liquid water warming to 100 degrees Celsius; a long flat plateau at 100 degrees Celsius shows boiling; a final sloped section shows steam warming above 100 degrees Celsius. The boiling plateau is much longer than the melting plateau.</desc>
<rect width="640" height="360" fill="white"/>
<g font-family="Arial" fill="#111827" font-size="12">
 <text x="330" y="20" text-anchor="middle" font-size="11" fill="#5b6675">Flat = phase change (temperature constant).   Sloped = one phase warming.</text>

 <line x1="80" y1="45" x2="80" y2="300" stroke="#111827" stroke-width="2"/>
 <line x1="80" y1="300" x2="610" y2="300" stroke="#111827" stroke-width="2"/>
 <text x="34" y="175" text-anchor="middle" fill="#5b6675" transform="rotate(-90 34 175)">Temperature (&#176;C)</text>
 <text x="345" y="340" text-anchor="middle" fill="#5b6675">Energy added &#8594;</text>

 <line x1="76" y1="230" x2="610" y2="230" stroke="#d5dbe3" stroke-width="1"/>
 <text x="70" y="234" text-anchor="end" fill="#5b6675">0</text>
 <line x1="76" y1="130" x2="610" y2="130" stroke="#d5dbe3" stroke-width="1"/>
 <text x="70" y="134" text-anchor="end" fill="#5b6675">100</text>

 <path d="M80,265 L120,230 L200,230 L250,130 L470,130 L540,80" fill="none" stroke="#1769aa" stroke-width="3"/>

 <text x="88" y="288" font-size="11">ice warms</text>
 <text x="160" y="222" text-anchor="middle" font-size="11" fill="#1a7f37">melting (0&#176;C)</text>
 <text x="150" y="180" text-anchor="middle" font-size="11">water warms</text>
 <text x="360" y="122" text-anchor="middle" font-size="11" fill="#1a7f37">boiling (100&#176;C) &#8212; long plateau</text>
 <text x="512" y="66" text-anchor="middle" font-size="11">steam warms</text>
</g>
</svg>
