<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
<title id="t">A cart rolling down a ramp into a spring bumper, shown at three stages</title>
<desc id="d">Stage 1: the cart is at rest at the top of a ramp at height h, with all its energy as gravitational potential energy. Stage 2: the cart is at the bottom moving fast, with all that energy now kinetic. Stage 3: the cart has compressed a spring bumper by x and is momentarily at rest, with the energy now stored as spring potential energy. On a frictionless track the three amounts are equal.</desc>
<rect width="640" height="300" fill="white"/>
<defs><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/></marker></defs>
<g font-family="Arial" fill="#111827" font-size="12">
 <text x="320" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">Frictionless track:  GPE at top  =  KE at bottom  =  spring PE at full compression</text>

 <line x1="30" y1="200" x2="610" y2="200" stroke="#5b6675" stroke-width="2"/>

 <!-- stage 1 ramp -->
 <path d="M45,200 L150,200 L45,110 Z" fill="none" stroke="#111827" stroke-width="2"/>
 <rect x="60" y="120" width="28" height="17" fill="#eef4f9" stroke="#1769aa" stroke-width="2" transform="rotate(-40 74 128)"/>
 <line x1="150" y1="110" x2="150" y2="200" stroke="#5b6675" stroke-width="1" stroke-dasharray="4 3"/>
 <text x="158" y="158" fill="#5b6675">h</text>
 <text x="95" y="232" text-anchor="middle" font-weight="bold">Stage 1: top, at rest</text>
 <text x="95" y="248" text-anchor="middle" fill="#5b6675">all GPE</text>

 <!-- stage 2 flat fast -->
 <rect x="285" y="183" width="30" height="17" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <line x1="322" y1="191" x2="366" y2="191" stroke="#1769aa" stroke-width="3" marker-end="url(#af)"/>
 <text x="315" y="232" text-anchor="middle" font-weight="bold">Stage 2: bottom, fast</text>
 <text x="315" y="248" text-anchor="middle" fill="#5b6675">all KE</text>

 <!-- stage 3 spring -->
 <line x1="600" y1="184" x2="600" y2="204" stroke="#111827" stroke-width="3"/>
 <path d="M600,194 h-9 l-6,-9 l-9,18 l-9,-18 l-9,18 l-6,-9 h-7" fill="none" stroke="#c0392b" stroke-width="3"/>
 <rect x="505" y="183" width="30" height="17" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <line x1="505" y1="212" x2="545" y2="212" stroke="#5b6675" stroke-width="1.5"/>
 <text x="525" y="226" text-anchor="middle" fill="#5b6675">x</text>
 <text x="545" y="262" text-anchor="middle" font-weight="bold">Stage 3: spring in by x, at rest</text>
 <text x="545" y="278" text-anchor="middle" fill="#5b6675">all spring PE</text>
</g>
</svg>
