<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="t d">
<title id="t">Energy bar charts for a ball falling in a closed, frictionless system</title>
<desc id="d">Two bar-chart panels share one energy axis marked 0 to 80 joules. At the top, before release, potential energy is 80 joules and kinetic energy is 0. At the bottom, just before landing, potential energy is 0 and kinetic energy is 80 joules. The total mechanical energy is 80 joules in both panels.</desc>
<rect width="560" height="360" fill="white"/>
<g font-family="Arial" fill="#111827" font-size="13">
 <line x1="70" y1="40" x2="70" y2="300" stroke="#111827" stroke-width="2"/>
 <line x1="70" y1="300" x2="520" y2="300" stroke="#111827" stroke-width="2"/>
 <text x="26" y="170" font-size="12" fill="#5b6675" text-anchor="middle" transform="rotate(-90 26 170)">Energy (J)</text>
 <g stroke="#d5dbe3" stroke-width="1">
  <line x1="70" y1="235" x2="520" y2="235"/>
  <line x1="70" y1="170" x2="520" y2="170"/>
  <line x1="70" y1="105" x2="520" y2="105"/>
  <line x1="70" y1="40" x2="520" y2="40"/>
 </g>
 <g fill="#5b6675" font-size="11" text-anchor="end">
  <text x="62" y="304">0</text><text x="62" y="239">20</text><text x="62" y="174">40</text><text x="62" y="109">60</text><text x="62" y="44">80</text>
 </g>

 <text x="180" y="26" font-weight="bold" text-anchor="middle">At the top (before release)</text>
 <rect x="120" y="298" width="60" height="2" fill="#1769aa"/>
 <text x="150" y="318" text-anchor="middle">KE = 0</text>
 <rect x="220" y="40" width="60" height="260" fill="#1769aa"/>
 <text x="250" y="318" text-anchor="middle">PE = 80</text>

 <text x="410" y="26" font-weight="bold" text-anchor="middle">Just before landing</text>
 <rect x="350" y="40" width="60" height="260" fill="#1769aa"/>
 <text x="380" y="318" text-anchor="middle">KE = 80</text>
 <rect x="450" y="298" width="60" height="2" fill="#1769aa"/>
 <text x="480" y="318" text-anchor="middle">PE = 0</text>

 <text x="290" y="344" font-size="12" fill="#1a7f37" text-anchor="middle">Total mechanical energy = 80 J at both points (nothing crosses the boundary).</text>
</g>
</svg>
