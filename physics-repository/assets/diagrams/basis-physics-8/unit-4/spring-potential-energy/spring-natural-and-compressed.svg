<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-labelledby="t d">
<title id="t">A spring at natural length and the same spring compressed by x</title>
<desc id="d">The top spring is at its natural length, storing zero spring potential energy, with its free end at a dashed reference line. The bottom spring is compressed by a distance x: a block has pushed its free end to the left of the reference line, storing spring potential energy equal to one half k x squared, which is always positive.</desc>
<rect width="560" height="260" fill="white"/>
<defs>
 <marker id="tri" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#5b6675"/></marker>
</defs>
<g font-family="Arial" fill="#111827">
 <!-- natural length -->
 <text x="30" y="40" font-size="13" font-weight="bold">Natural length</text>
 <line x1="55" y1="52" x2="55" y2="98" stroke="#111827" stroke-width="4"/>
 <path d="M55,75 H75 L105,59 L135,91 L165,59 L195,91 L225,59 L255,91 L285,75 H300" fill="none" stroke="#1769aa" stroke-width="3"/>
 <line x1="300" y1="46" x2="300" y2="104" stroke="#5b6675" stroke-width="2" stroke-dasharray="5 4"/>
 <text x="310" y="70" font-size="12" fill="#5b6675">reference: free end at natural length</text>
 <text x="150" y="126" font-size="13" fill="#1a7f37" text-anchor="middle">spring PE = 0</text>

 <!-- compressed -->
 <text x="30" y="176" font-size="13" font-weight="bold">Compressed by x</text>
 <line x1="55" y1="188" x2="55" y2="234" stroke="#111827" stroke-width="4"/>
 <path d="M55,211 H75 L98,195 L121,227 L144,195 L167,227 L190,195 L213,227 L235,211 H250" fill="none" stroke="#c0392b" stroke-width="3"/>
 <rect x="250" y="189" width="44" height="44" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <line x1="300" y1="184" x2="300" y2="252" stroke="#5b6675" stroke-width="2" stroke-dasharray="5 4"/>
 <line x1="250" y1="246" x2="300" y2="246" stroke="#5b6675" stroke-width="1.5" marker-start="url(#tri)" marker-end="url(#tri)"/>
 <text x="275" y="262" font-size="13" text-anchor="middle" font-weight="bold">x</text>
 <text x="330" y="214" font-size="13" fill="#1a7f37">spring PE = &#189; k x&#178;   (always &gt; 0)</text>
</g>
</svg>
