<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240" role="img" aria-labelledby="t d">
<title id="t">Net work equals the change in kinetic energy</title>
<desc id="d">A block starts moving slowly with a small kinetic energy. A net force acts on it over a displacement d, doing positive net work. The block ends moving faster with a larger kinetic energy. The net work done equals the final kinetic energy minus the initial kinetic energy.</desc>
<rect width="620" height="240" fill="white"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/></marker></defs>
<g font-family="Arial" fill="#111827">
 <line x1="40" y1="150" x2="580" y2="150" stroke="#5b6675" stroke-width="2"/>

 <rect x="70" y="118" width="46" height="32" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <text x="93" y="108" font-size="12" text-anchor="middle">slow</text>
 <text x="93" y="178" font-size="12" fill="#5b6675" text-anchor="middle">KE<tspan dy="3" font-size="9">start</tspan></text>

 <line x1="150" y1="132" x2="430" y2="132" stroke="#1769aa" stroke-width="3" marker-end="url(#ar)"/>
 <text x="290" y="122" font-size="12" fill="#1769aa" text-anchor="middle">net force</text>
 <line x1="150" y1="150" x2="470" y2="150" stroke="#5b6675" stroke-width="1"/>
 <text x="300" y="167" font-size="11" fill="#5b6675" text-anchor="middle">displacement d</text>

 <rect x="486" y="118" width="46" height="32" fill="#eef4f9" stroke="#1769aa" stroke-width="2"/>
 <text x="509" y="108" font-size="12" text-anchor="middle">fast</text>
 <text x="509" y="178" font-size="12" fill="#5b6675" text-anchor="middle">KE<tspan dy="3" font-size="9">end</tspan></text>

 <text x="310" y="214" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle">net work  =  KE(end) &#8722; KE(start)  =  change in KE</text>
</g>
</svg>
