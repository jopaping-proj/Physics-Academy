<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="t d"><title id="t">A spring at natural length compared to a compressed spring</title><desc id="d">Two horizontal springs are shown one above the other. The top spring is at its natural (unstretched) length, with its right end marked by a dashed reference line. The bottom spring is compressed, its right end (attached to a block) displaced to the left of the same reference line by a distance labeled x.</desc>
<g font-family="Arial" font-size="16">
<text x="40" y="60">Natural length</text>
<path d="M60 90 L75 90 L85 75 L100 105 L115 75 L130 105 L145 75 L160 105 L175 75 L190 90 L280 90" stroke="#145a9c" stroke-width="3" fill="none"/>
<path d="M60 70V110" stroke="#111" stroke-width="3"/>
<path d="M280 70V110" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
<text x="40" y="180">Compressed</text>
<path d="M60 210 L72 210 L80 195 L92 225 L104 195 L116 225 L128 195 L140 225 L152 195 L164 210 L200 210" stroke="#b3261e" stroke-width="3" fill="none"/>
<rect x="200" y="188" width="40" height="44" fill="#eaf2f7" stroke="#145a9c" stroke-width="2"/>
<path d="M60 190V230" stroke="#111" stroke-width="3"/>
<path d="M280 190V230" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
<defs><marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#555"/></marker><marker id="ah4" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#555"/></marker></defs>
<path d="M240 255L280 255" stroke="#555" stroke-width="2" marker-end="url(#ah3)" marker-start="url(#ah4)"/>
<text x="252" y="278">x</text>
</g>
</svg>
