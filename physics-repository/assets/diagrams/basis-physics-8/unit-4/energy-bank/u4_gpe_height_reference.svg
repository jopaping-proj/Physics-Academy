<svg xmlns="http://www.w3.org/2000/svg" width="500" height="420" viewBox="0 0 500 420" role="img" aria-labelledby="t d"><title id="t">An object at height h above a labeled reference line</title><desc id="d">A ball sits at a marked height above a horizontal reference line. A vertical dashed line with double-headed arrow spans from the reference line up to the ball, labeled h. The reference line itself is labeled as the reference point.</desc>
