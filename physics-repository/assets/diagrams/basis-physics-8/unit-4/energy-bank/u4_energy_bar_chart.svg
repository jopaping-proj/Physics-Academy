<svg xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380" role="img" aria-labelledby="t d"><title id="t">Bar chart of kinetic and potential energy at a single point</title><desc id="d">A bar chart with two bars on a labeled vertical energy axis. The left bar, labeled KE, rises to 40 joules. The right bar, labeled PE, rises to 65 joules. Horizontal gridlines mark 0, 20, 40, 60, 80, and 100 joules.</desc>
<g font-family="Arial" font-size="14">
<path d="M70 40V320H400" stroke="#111" stroke-width="2" fill="none"/>
<path d="M70 320H60M70 256H60M70 192H60M70 128H60M70 64H60" stroke="#111" stroke-width="1"/>
<path d="M70 320H400M70 256H400M70 192H400M70 128H400M70 64H400" stroke="#ddd" stroke-width="1"/>
<text x="50" y="325" text-anchor="end">0</text>
<text x="50" y="261" text-anchor="end">20</text>
<text x="50" y="197" text-anchor="end">40</text>
<text x="50" y="133" text-anchor="end">60</text>
<text x="50" y="69" text-anchor="end">80</text>
<text x="20" y="180" text-anchor="middle" transform="rotate(-90 20 180)">Energy (J)</text>
<rect x="150" y="192" width="70" height="128" fill="#145a9c"/>
<text x="185" y="340" text-anchor="middle">KE</text>
<text x="185" y="178" text-anchor="middle">40 J</text>
<rect x="280" y="88" width="70" height="232" fill="#b3261e"/>
<text x="315" y="340" text-anchor="middle">PE</text>
<text x="315" y="83" text-anchor="middle">65 J</text>
</g>
</svg>
