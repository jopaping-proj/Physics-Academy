<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="t d"><title id="t">A block pushed up a frictionless ramp by a force directed along the ramp surface</title><desc id="d">A block sits on an inclined ramp. An arrow along the ramp surface, pointing up the slope, represents the applied force. A dashed arrow along the same direction represents the block's three-meter displacement up the ramp.</desc>
<path d="M120 350H500" stroke="#111" stroke-width="3"/>
<path d="M120 150V350" stroke="#111" stroke-width="2"/>
<path d="M120 150L480 350" stroke="#145a9c" stroke-width="4" fill="none"/>
<defs><marker id="fah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3261e"/></marker><marker id="dah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#555"/></marker></defs>
<g transform="translate(264,230) rotate(29.05)">
<rect x="-35" y="-38" width="70" height="38" fill="#eaf2f7" stroke="#145a9c" stroke-width="2"/>
<path d="M-35 -55L-140 -55" stroke="#b3261e" stroke-width="4" marker-end="url(#fah)"/>
<path d="M20 -70L-85 -70" stroke="#555" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dah)"/>
</g>
<g font-family="Arial" font-size="18">
<text x="120" y="130" text-anchor="middle">F = 80 N</text>
<text x="180" y="150" text-anchor="middle">d = 3.0 m</text>
<text x="300" y="335" text-anchor="middle">15 kg</text>
</g>
</svg>
