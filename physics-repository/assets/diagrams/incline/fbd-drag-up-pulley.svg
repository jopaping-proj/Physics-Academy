<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img"
     aria-label="Two free-body diagrams. Left: a box resting flush on a 37-degree incline, being dragged up the slope. Gravity acts straight down from the box's centre; the normal force starts at the contact face and points perpendicular to the surface, away from it; the rope tension starts at the box and points up the slope; kinetic friction starts at the contact face and points down the slope, opposing the up-slope motion. Right: the hanging mass. The rope tension acts up from the top of the box; gravity acts down from the centre and is the longer arrow.">
  <defs>
    <marker id="fp-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="fp-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="fp-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f0c27a"/></marker>
    <marker id="fp-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
  <line x1="188" y1="12" x2="188" y2="190" stroke="#8b96a5" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="92" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#8b96a5">box on the incline</text>

  <!-- incline theta ~ 37 deg. A(20,168) -> C(168,56). along-up (0.8,-0.6), normal-out (-0.6,-0.8) -->
  <line x1="20" y1="168" x2="168" y2="56" stroke="#8b96a5" stroke-width="1.4"/>
  <path d="M46 168 A26 26 0 0 0 44.4 152.4" fill="none" stroke="#8b96a5" stroke-width="1"/>
  <text x="52" y="162" font-size="9" fill="#8b96a5">&#952;</text>

  <!-- block flush on the slope. P (contact-face centre) = (92,114); centre = P + n*11 = (85.4,105.2) -->
  <polygon points="76,126 108,102 96.8,87.2 64.8,111.2" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.3"/>
  <circle cx="86.4" cy="106.6" r="1.8" fill="#e6edf3"/>

  <!-- gravity: from the CENTRE, straight down -->
  <line x1="86.4" y1="106.6" x2="86.4" y2="160" stroke="#8b96a5" stroke-width="2.4" marker-end="url(#fp-grey)"/>
  <text x="92" y="156" font-size="9.5" font-weight="700" fill="#8b96a5">mg</text>

  <!-- normal force: from the CONTACT FACE (P), perpendicular out (-0.6,-0.8) -->
  <line x1="92" y1="114" x2="70.4" y2="85.2" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#fp-blue)"/>
  <text x="62" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#58a6ff">F<tspan font-size="7" dy="2">N</tspan></text>

  <!-- rope tension: from the box (up-slope face), up the slope (0.8,-0.6) -->
  <line x1="102" y1="105" x2="134" y2="81" stroke="#f0c27a" stroke-width="2.4" marker-end="url(#fp-amber)"/>
  <text x="140" y="78" font-size="9.5" font-weight="700" fill="#f0c27a">F<tspan font-size="7" dy="2">T</tspan></text>

  <!-- kinetic friction: from the CONTACT FACE (P), down the slope (-0.8,0.6) since the box moves up -->
  <line x1="92" y1="114" x2="68" y2="132" stroke="#f85149" stroke-width="2.4" marker-end="url(#fp-red)"/>
  <text x="60" y="138" text-anchor="middle" font-size="9.5" font-weight="700" font-style="italic" fill="#f85149">f<tspan font-size="7" dy="2">k</tspan></text>

  <!-- hanging mass -->
  <text x="250" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#8b96a5">hanging mass</text>
  <rect x="238" y="84" width="24" height="20" rx="2" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.3"/>
  <circle cx="250" cy="94" r="1.6" fill="#e6edf3"/>
  <line x1="250" y1="84" x2="250" y2="50" stroke="#f0c27a" stroke-width="2.4" marker-end="url(#fp-amber)"/>
  <text x="256" y="56" font-size="9.5" font-weight="700" fill="#f0c27a">F<tspan font-size="7" dy="2">T</tspan></text>
  <line x1="250" y1="94" x2="250" y2="146" stroke="#8b96a5" stroke-width="2.6" marker-end="url(#fp-grey)"/>
  <text x="256" y="132" font-size="9.5" font-weight="700" fill="#8b96a5">mg</text>
  </g>
</svg>
