<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img"
     aria-label="Two free-body diagrams. Left: a box on an incline being dragged up the slope. Gravity acts straight down from the centre; the normal force is perpendicular to the incline surface; the rope tension acts up the slope; kinetic friction acts down the slope, opposing the up-slope motion. Right: the hanging mass. The rope tension acts up; gravity acts down and is the larger arrow, so it accelerates downward.">
  <defs>
    <marker id="du-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="du-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="du-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f0c27a"/></marker>
    <marker id="du-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
  <line x1="176" y1="12" x2="176" y2="140" stroke="#8b96a5" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="90" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#8b96a5">box on the incline</text>

  <!-- incline surface ~37deg for context -->
  <line x1="18" y1="128" x2="150" y2="30" stroke="#8b96a5" stroke-width="1.3"/>
  <!-- box on the slope, centre ~(84,79), rotated -37deg -->
  <g transform="rotate(-37 84 79)">
    <rect x="70" y="65" width="28" height="16" rx="2" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.3"/>
  </g>
  <circle cx="84" cy="79" r="1.8" fill="#e6edf3"/>
  <!-- gravity straight down -->
  <line x1="84" y1="79" x2="84" y2="122" stroke="#8b96a5" stroke-width="2.3" marker-end="url(#du-grey)"/>
  <text x="89" y="118" font-size="9" font-weight="700" fill="#8b96a5">mg</text>
  <!-- normal force perpendicular to the slope, outward. slope dir (0.8,-0.6); outward normal (-0.6,-0.8) -->
  <line x1="80" y1="73" x2="59" y2="45" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#du-blue)"/>
  <text x="52" y="41" text-anchor="middle" font-size="9" font-weight="700" fill="#58a6ff">F<tspan font-size="6.5" dy="1.5">N</tspan></text>
  <!-- tension up the slope (0.8,-0.6) -->
  <line x1="90" y1="72" x2="118" y2="51" stroke="#f0c27a" stroke-width="2.4" marker-end="url(#du-amber)"/>
  <text x="125" y="48" font-size="9" font-weight="700" fill="#f0c27a">F<tspan font-size="6.5" dy="1.5">T</tspan></text>
  <!-- kinetic friction down the slope (-0.8,0.6) since box moves up -->
  <line x1="78" y1="86" x2="55" y2="103" stroke="#f85149" stroke-width="2.4" marker-end="url(#du-red)"/>
  <text x="47" y="108" text-anchor="middle" font-size="9" font-weight="700" font-style="italic" fill="#f85149">f<tspan font-size="6.5" dy="1.5">k</tspan></text>

  <!-- hanging mass -->
  <text x="238" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#8b96a5">hanging mass</text>
  <rect x="226" y="66" width="24" height="20" rx="2" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.3"/>
  <line x1="238" y1="66" x2="238" y2="36" stroke="#f0c27a" stroke-width="2.4" marker-end="url(#du-amber)"/>
  <text x="243" y="42" font-size="9" font-weight="700" fill="#f0c27a">F<tspan font-size="6.5" dy="1.5">T</tspan></text>
  <line x1="238" y1="86" x2="238" y2="128" stroke="#8b96a5" stroke-width="2.6" marker-end="url(#du-grey)"/>
  <text x="243" y="120" font-size="9" font-weight="700" fill="#8b96a5">mg</text>
  </g>
</svg>
