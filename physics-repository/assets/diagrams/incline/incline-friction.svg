<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 214" role="img"
     aria-label="A block sliding down a rough incline of angle theta (about 20 degrees), resting flush on the surface. Three real forces act: gravity straight down from the block's centre; the normal force perpendicular to the surface, starting at the contact face; and kinetic friction along the surface pointing up the slope, starting at the contact face, opposing the downhill slide. Along the slope the net force is m g sine theta minus the friction force.">
  <defs>
    <marker id="inr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="inr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="inr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
  </defs>

  <!-- incline: theta ~ 20 deg -->
  <path d="M40 180 L320 180 L320 78 Z" fill="#8b96a5" fill-opacity="0.09" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1">
    <line x1="58" y1="180" x2="50" y2="190"/><line x1="98" y1="180" x2="90" y2="190"/>
    <line x1="138" y1="180" x2="130" y2="190"/><line x1="178" y1="180" x2="170" y2="190"/>
    <line x1="218" y1="180" x2="210" y2="190"/><line x1="258" y1="180" x2="250" y2="190"/>
    <line x1="298" y1="180" x2="290" y2="190"/>
  </g>
  <path d="M82 180 A42 42 0 0 0 79.5 164.7" fill="none" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="92" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">&#952;</text>

  <!-- block flush on the slope. Bottom face centre P=(150,140); corners rotated -20deg. -->
  <polygon points="131.2,146.8 168.8,133.2 161.3,112.5 123.7,126.1" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="146.2" cy="129.7" r="2" fill="#e6edf3"/>

  <!-- gravity: straight down from the centre -->
  <line x1="146.2" y1="129.7" x2="146.2" y2="196" stroke="#8b96a5" stroke-width="3" marker-end="url(#inr-grey)"/>
  <text x="146.2" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b96a5">m g</text>

  <!-- normal force: from the contact face, outward perpendicular (-0.342,-0.940) -->
  <line x1="150" y1="140" x2="132.2" y2="91" stroke="#58a6ff" stroke-width="3" marker-end="url(#inr-blue)"/>
  <text x="124" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#58a6ff">F<tspan font-size="8" dy="2">N</tspan></text>

  <!-- kinetic friction: from the contact face (offset up-slope from F_N's tail), up the slope (0.940,-0.342) -->
  <line x1="157.5" y1="137.3" x2="187.4" y2="126.4" stroke="#f85149" stroke-width="3" marker-end="url(#inr-red)"/>
  <text x="196" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#f85149">f</text>

  <text x="168" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">sliding down &#8594; friction f points up the slope</text>
  <text x="168" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">net force along the slope = m g sin&#952; &#8722; f</text>
</svg>
