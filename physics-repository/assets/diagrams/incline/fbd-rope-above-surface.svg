<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" role="img"
     aria-label="Free-body diagram of a block on a 30-degree incline being pulled up the slope by a rope that makes 20 degrees with the incline surface. Gravity acts straight down from the block's centre. The normal force starts at the contact face and points perpendicular to the surface. The rope tension starts at the block and points up and away from the surface at 20 degrees above it. Kinetic friction starts at the contact face and points down the slope, opposing the up-slope motion.">
  <defs>
    <marker id="ra-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="ra-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="ra-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f0c27a"/></marker>
    <marker id="ra-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
  <!-- incline theta = 30. A(20,164)->C(210,54). along-up (0.866,-0.5), normal-out (-0.5,-0.866) -->
  <line x1="20" y1="164" x2="210" y2="54" stroke="#8b96a5" stroke-width="1.4"/>
  <path d="M48 164 A28 28 0 0 0 45.6 150" fill="none" stroke="#8b96a5" stroke-width="1"/>
  <text x="56" y="158" font-size="9" fill="#8b96a5">30&#176;</text>

  <!-- block flush, P (contact centre) = (104,116); centre = P + n*11 = (98.5,106.5) -->
  <polygon points="86.7,126 121.3,106 110.3,86.9 75.7,106.9" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1.3"/>
  <circle cx="98.5" cy="106.5" r="1.8" fill="#e6edf3"/>

  <!-- gravity from CENTRE, down -->
  <line x1="98.5" y1="106.5" x2="98.5" y2="162" stroke="#8b96a5" stroke-width="2.4" marker-end="url(#ra-grey)"/>
  <text x="104" y="158" font-size="9.5" font-weight="700" fill="#8b96a5">mg</text>

  <!-- normal force from CONTACT FACE P, perpendicular out (-0.5,-0.866) -->
  <line x1="104" y1="116" x2="82" y2="77.9" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#ra-blue)"/>
  <text x="74" y="73" text-anchor="middle" font-size="9.5" font-weight="700" fill="#58a6ff">F<tspan font-size="7" dy="2">N</tspan></text>

  <!-- rope tension from the block, 20deg above the surface. surface-up = -30deg; +20 toward normal -> -50deg -> (0.643,-0.766) -->
  <line x1="112" y1="107" x2="150" y2="61.8" stroke="#f0c27a" stroke-width="2.4" marker-end="url(#ra-amber)"/>
  <text x="157" y="58" font-size="9.5" font-weight="700" fill="#f0c27a">F<tspan font-size="7" dy="2">T</tspan></text>
  <!-- 20deg arc between the surface direction and the rope, at the block's up-slope corner -->
  <path d="M133.6 92 A22 22 0 0 0 126.7 84.9" fill="none" stroke="#8b96a5" stroke-width="1"/>
  <text x="140" y="86" font-size="8" fill="#8b96a5">20&#176;</text>

  <!-- kinetic friction from CONTACT FACE P, down the slope (-0.866,0.5) since block moves up -->
  <line x1="104" y1="116" x2="78" y2="131" stroke="#f85149" stroke-width="2.4" marker-end="url(#ra-red)"/>
  <text x="70" y="137" text-anchor="middle" font-size="9.5" font-weight="700" font-style="italic" fill="#f85149">f<tspan font-size="7" dy="2">k</tspan></text>
  </g>
</svg>
