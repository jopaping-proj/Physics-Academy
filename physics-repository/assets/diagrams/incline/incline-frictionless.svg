<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" role="img"
     aria-label="A block resting flush on a frictionless incline of angle theta (about 20 degrees). Two real forces act: gravity straight down from the block's centre, and the normal force perpendicular to the incline surface, starting at the contact face. Gravity is resolved into a component m g sine theta down the slope and m g cosine theta perpendicular into the slope. Below the block, an arc marks the angle theta between the weight vector (straight down) and the into-slope perpendicular direction (opposite the normal force). The normal force balances the perpendicular component, so the normal force equals m g cosine theta, which is less than m g, and the net force is m g sine theta down the slope.">
  <defs>
    <marker id="inf-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="inf-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="inf-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- incline: theta ~ 20 deg. A(40,190) bottom-left, B(320,190), C(320,88) -->
  <path d="M40 190 L320 190 L320 88 Z" fill="#8b96a5" fill-opacity="0.09" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1">
    <line x1="58" y1="190" x2="50" y2="200"/><line x1="98" y1="190" x2="90" y2="200"/>
    <line x1="138" y1="190" x2="130" y2="200"/><line x1="178" y1="190" x2="170" y2="200"/>
    <line x1="218" y1="190" x2="210" y2="200"/><line x1="258" y1="190" x2="250" y2="200"/>
    <line x1="298" y1="190" x2="290" y2="200"/>
  </g>
  <!-- base angle theta -->
  <path d="M82 190 A42 42 0 0 0 79.5 174.7" fill="none" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="92" y="182" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">&#952;</text>

  <!-- block: bottom face flush on the slope. BL(131.2,156.8) BR(168.8,143.2) TR(161.3,122.5) TL(123.7,136.1) -->
  <polygon points="131.2,156.8 168.8,143.2 161.3,122.5 123.7,136.1" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>
  <!-- centre dot -->
  <circle cx="146.2" cy="139.7" r="2" fill="#e6edf3"/>

  <!-- gravity: straight down from the centre -->
  <line x1="146.2" y1="139.7" x2="146.2" y2="204" stroke="#8b96a5" stroke-width="3" marker-end="url(#inf-grey)"/>
  <text x="146.2" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b96a5">m g</text>

  <!-- perpendicular component of the weight: into the slope, dir (0.342,0.940) -->
  <line x1="146.2" y1="139.7" x2="166.7" y2="196.1" stroke="#8b96a5" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#inf-dash)"/>
  <text x="205" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">m g cos&#952;</text>
  <line x1="176" y1="182" x2="167" y2="188" stroke="#8b96a5" stroke-width="0.8"/>

  <!-- parallel component of the weight: down the slope, dir (-0.940,0.342) -->
  <line x1="146.2" y1="139.7" x2="122" y2="148.5" stroke="#8b96a5" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#inf-dash)"/>
  <text x="86" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">m g sin&#952;</text>
  <path d="M92 124 Q 108 132 119 146" fill="none" stroke="#8b96a5" stroke-width="0.8"/>

  <!-- completing the component parallelogram -->
  <path d="M166.7 196.1 L146.2 203.7 M122 148.5 L146.2 203.7" fill="none" stroke="#8b96a5" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- angle theta between the weight vector (straight down) and the into-slope
       perpendicular direction (opposite F_N) — drawn below the ramp where the
       wedge has room -->
  <path d="M146.2 183.7 A44 44 0 0 1 161.2 181.1" fill="none" stroke="#8b96a5" stroke-width="1.3"/>
  <text x="153" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b96a5">&#952;</text>

  <!-- normal force: from the contact face, perpendicular to the slope, outward (-0.342,-0.940) -->
  <line x1="150" y1="150" x2="132.2" y2="101" stroke="#58a6ff" stroke-width="3" marker-end="url(#inf-blue)"/>
  <text x="124" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#58a6ff">F<tspan font-size="8" dy="2">N</tspan></text>

  <text x="170" y="13" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">F<tspan font-size="8" dy="2">N</tspan><tspan dy="-2"> = m g cos&#952; (&lt; m g)  &#183;  net force = m g sin&#952; down the slope</tspan></text>
</svg>
