<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" role="img"
     aria-label="A block on a frictionless incline of angle theta. Two forces act: gravity straight down from the centre, and the normal force perpendicular to the incline surface. Gravity is resolved into a component m g sine theta down the slope and m g cosine theta into the slope; the normal force balances the perpendicular component, so the normal force equals m g cosine theta, which is less than m g. The block accelerates down the slope.">
  <!-- Hand-authored. Labels placed clear of the incline, block, arrows,
       dashed components and angle arcs (master-project-prompt.md §11). -->
  <defs>
    <marker id="in1-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
    <marker id="in1-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="in1-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- incline triangle: A bottom-left (angle theta), B bottom-right (right angle), C top-right -->
  <path d="M36 196 L320 196 L320 92 Z" fill="#8b96a5" fill-opacity="0.10" stroke="#8b96a5" stroke-width="1.5"/>
  <!-- ground hatching under the base -->
  <g stroke="#8b96a5" stroke-width="1">
    <line x1="54" y1="196" x2="46" y2="206"/><line x1="94" y1="196" x2="86" y2="206"/>
    <line x1="134" y1="196" x2="126" y2="206"/><line x1="174" y1="196" x2="166" y2="206"/>
    <line x1="214" y1="196" x2="206" y2="206"/><line x1="254" y1="196" x2="246" y2="206"/>
    <line x1="294" y1="196" x2="286" y2="206"/>
  </g>
  <!-- angle theta at the base -->
  <path d="M74 196 A38 38 0 0 0 72.6 182.5" fill="none" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="84" y="188" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">&#952;</text>

  <!-- block on the incline, centred near the middle of the slope -->
  <g transform="rotate(-21.6 168 143)">
    <rect x="150" y="130" width="36" height="24" rx="2" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>
  </g>
  <circle cx="168" cy="143" r="2" fill="#e6edf3"/>

  <!-- gravity: straight down from the centre -->
  <line x1="168" y1="143" x2="168" y2="205" stroke="#8b96a5" stroke-width="3" marker-end="url(#in1-grey)"/>
  <text x="168" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b96a5">m g</text>

  <!-- dashed components of gravity -->
  <!-- perpendicular into the slope: direction (sin21.6, cos21.6) ~ (0.368, 0.930) -->
  <line x1="168" y1="143" x2="189" y2="196" stroke="#8b96a5" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#in1-dash)"/>
  <text x="205" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">m g cos&#952;</text>
  <!-- parallel down the slope: direction (-cos21.6, sin21.6) ~ (-0.930, 0.368) -->
  <line x1="168" y1="143" x2="121" y2="162" stroke="#8b96a5" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#in1-dash)"/>
  <text x="96" y="158" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">m g sin&#952;</text>
  <!-- the little completing lines of the component rectangle -->
  <path d="M121 162 L142 215 M189 196 L142 215" fill="none" stroke="#8b96a5" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- normal force: perpendicular to the slope, outward (up-left): (-0.368, -0.930) -->
  <line x1="168" y1="143" x2="147" y2="90" stroke="#58a6ff" stroke-width="3" marker-end="url(#in1-blue)"/>
  <text x="138" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#58a6ff">F<tspan font-size="8" dy="2">N</tspan></text>

  <text x="180" y="13" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">F<tspan font-size="8" dy="2">N</tspan><tspan dy="-2"> = m g cos&#952;, which is less than m g</tspan></text>
  <text x="180" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">net force along the slope = m g sin&#952; (down)</text>
</svg>
