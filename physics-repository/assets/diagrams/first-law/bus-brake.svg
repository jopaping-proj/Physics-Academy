<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 196" role="img"
     aria-label="A bus braking. A red arrow beneath the bus points backward, labelled 'bus slows — friction from the road'. Inside the bus a standing passenger has a green forward arrow, labelled 'passenger keeps moving forward — no backward force, so inertia carries them on'.">
  <!-- Labels placed clear of the bus, the passenger, and the arrows (master-project-prompt.md §11). -->
  <defs>
    <marker id="bb-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
    <marker id="bb-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#48c9b0"/></marker>
  </defs>

  <!-- passenger labels, above the bus -->
  <text x="196" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#48c9b0">passenger keeps moving forward</text>
  <text x="196" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#48c9b0">no backward force — inertia carries them on</text>

  <!-- road -->
  <line x1="16" y1="150" x2="324" y2="150" stroke="#8b96a5" stroke-width="1.5"/>

  <!-- wheels sit exactly on the road line (centre 8 px above it) -->
  <circle cx="94" cy="142" r="8" fill="none" stroke="#8b96a5" stroke-width="2"/>
  <circle cx="236" cy="142" r="8" fill="none" stroke="#8b96a5" stroke-width="2"/>

  <!-- bus body, resting just above the wheels -->
  <rect x="46" y="50" width="238" height="86" rx="8" fill="#58a6ff" fill-opacity="0.07" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="58" y="62" width="24" height="20" rx="2" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="1"/>
  <rect x="90" y="62" width="24" height="20" rx="2" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="1"/>

  <!-- passenger, standing -->
  <circle cx="150" cy="74" r="6.5" fill="#e6edf3" stroke="#e6edf3" stroke-width="1"/>
  <rect x="142" y="82" width="16" height="44" rx="4" fill="#e6edf3" stroke="#e6edf3" stroke-width="1"/>

  <!-- passenger keeps moving forward (right) -->
  <line x1="164" y1="100" x2="212" y2="100" stroke="#48c9b0" stroke-width="3.5" marker-end="url(#bb-teal)"/>

  <!-- bus slows: red arrow backward, beneath the bus -->
  <line x1="152" y1="164" x2="104" y2="164" stroke="#f85149" stroke-width="3.5" marker-end="url(#bb-red)"/>
  <text x="164" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f85149">bus slows — friction from the road</text>
</svg>
