<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 168" role="img"
     aria-label="A sign hangs from the middle of a cable strung between two poles. The cable sags only slightly, so each half makes a small angle theta with the horizontal. An arc at the sign marks theta.">
  <!-- Labels placed clear of the poles, cable, sign, and each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="sc-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- ground + poles -->
  <line x1="12" y1="140" x2="328" y2="140" stroke="#8b96a5" stroke-width="1.5"/>
  <line x1="30" y1="44" x2="30" y2="140" stroke="#8b96a5" stroke-width="3"/>
  <line x1="310" y1="44" x2="310" y2="140" stroke="#8b96a5" stroke-width="3"/>

  <!-- cable: two nearly-horizontal segments to the sign at the middle -->
  <line x1="30" y1="44" x2="170" y2="72" stroke="#f0c27a" stroke-width="2.5"/>
  <line x1="310" y1="44" x2="170" y2="72" stroke="#f0c27a" stroke-width="2.5"/>

  <!-- sign -->
  <rect x="146" y="72" width="48" height="30" rx="3" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="170" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">sign</text>

  <!-- weight -->
  <line x1="170" y1="102" x2="170" y2="128" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#sc-grey)"/>
  <text x="170" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b96a5">W</text>

  <!-- angle theta between the right cable segment and the horizontal, at the sign -->
  <line x1="170" y1="72" x2="222" y2="72" stroke="#8b96a5" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 200 72 A 30 30 0 0 0 197.5 61.9" fill="none" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="210" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">θ</text>
  <text x="252" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">(small)</text>
</svg>
