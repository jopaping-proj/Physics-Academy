<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" role="img"
     aria-label="A sign hangs from the middle of a cable strung between two poles. The cable sags only slightly, so each half makes a small angle theta with the horizontal. An arc at the sign marks theta between the right half of the cable and the horizontal.">
  <!-- Labels placed clear of the poles, cable, sign, and each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="sc-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- ground + poles -->
  <line x1="12" y1="142" x2="328" y2="142" stroke="#8b96a5" stroke-width="1.5"/>
  <line x1="30" y1="46" x2="30" y2="142" stroke="#8b96a5" stroke-width="3"/>
  <line x1="310" y1="46" x2="310" y2="142" stroke="#8b96a5" stroke-width="3"/>

  <!-- cable: two nearly-horizontal segments to the sign at the middle -->
  <line x1="30" y1="46" x2="170" y2="74" stroke="#f0c27a" stroke-width="2.5"/>
  <line x1="310" y1="46" x2="170" y2="74" stroke="#f0c27a" stroke-width="2.5"/>

  <!-- angle theta: horizontal reference from the sign, and an arc up to the right cable -->
  <line x1="170" y1="74" x2="232" y2="74" stroke="#8b96a5" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 214 74 A 44 44 0 0 0 212.4 65.4" fill="none" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="226" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">θ</text>

  <!-- sign -->
  <rect x="146" y="74" width="48" height="30" rx="3" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="170" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">sign</text>

  <!-- weight -->
  <line x1="170" y1="104" x2="170" y2="130" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#sc-grey)"/>
  <text x="170" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#8b96a5">W</text>
</svg>
