<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img"
     aria-label="Free-body diagram of a crate pushed to the right across a rough floor while speeding up. Four forces from the crate: gravity down, the normal force up, a long applied-push arrow to the right, and a shorter kinetic-friction arrow to the left. The push is longer than friction, so the net force is to the right.">
  <defs>
    <marker id="pc-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
    <marker id="pc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="pc-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="pc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>

  <line x1="34" y1="150" x2="286" y2="150" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2">
    <line x1="46" y1="150" x2="38" y2="160"/><line x1="70" y1="150" x2="62" y2="160"/>
    <line x1="94" y1="150" x2="86" y2="160"/><line x1="118" y1="150" x2="110" y2="160"/>
    <line x1="142" y1="150" x2="134" y2="160"/><line x1="166" y1="150" x2="158" y2="160"/>
    <line x1="190" y1="150" x2="182" y2="160"/><line x1="214" y1="150" x2="206" y2="160"/>
    <line x1="238" y1="150" x2="230" y2="160"/><line x1="262" y1="150" x2="254" y2="160"/>
  </g>

  <rect x="118" y="118" width="60" height="32" rx="3" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="148" cy="134" r="2.5" fill="#e6edf3"/>

  <line x1="144" y1="134" x2="144" y2="198" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#pc-grey)"/>
  <text x="120" y="192" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="128" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <line x1="152" y1="150" x2="152" y2="70" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#pc-blue)"/>
  <text x="158" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="166" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>

  <line x1="148" y1="128" x2="270" y2="128" stroke="#f0c27a" stroke-width="3" marker-end="url(#pc-amber)"/>
  <text x="210" y="120" font-family="system-ui, sans-serif" font-size="13" fill="#f0c27a">F</text>
  <text x="218" y="124" font-family="system-ui, sans-serif" font-size="10" fill="#f0c27a">app</text>

  <line x1="148" y1="142" x2="96" y2="142" stroke="#f85149" stroke-width="3" marker-end="url(#pc-red)"/>
  <text x="66" y="136" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#f85149">f</text>
</svg>
