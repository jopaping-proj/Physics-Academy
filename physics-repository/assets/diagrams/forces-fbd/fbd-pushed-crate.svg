<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 224" role="img"
     aria-label="Free-body diagram of a crate pushed to the right across a rough floor while speeding up. Gravity acts down from the crate's centre. The normal force acts up from the crate's bottom surface. The applied push acts to the right, starting at the crate's left (back) face. Kinetic friction acts to the left along the bottom surface. The push arrow is clearly longer than the friction arrow, so the net force is to the right.">
  <!-- DIAGRAM RULE (master-project-prompt.md §11): in a BOX diagram, a
       contact-force arrow starts at the surface / point of contact;
       only the field force (gravity) starts at the centre dot.
       Parallel arrows are laterally offset so none coincide.
       Relative arrow lengths carry meaning. -->
  <defs>
    <marker id="pc-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
    <marker id="pc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="pc-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="pc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>

  <!-- floor -->
  <line x1="34" y1="170" x2="286" y2="170" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2">
    <line x1="46" y1="170" x2="38" y2="180"/><line x1="70" y1="170" x2="62" y2="180"/>
    <line x1="94" y1="170" x2="86" y2="180"/><line x1="118" y1="170" x2="110" y2="180"/>
    <line x1="142" y1="170" x2="134" y2="180"/><line x1="166" y1="170" x2="158" y2="180"/>
    <line x1="190" y1="170" x2="182" y2="180"/><line x1="214" y1="170" x2="206" y2="180"/>
    <line x1="238" y1="170" x2="230" y2="180"/><line x1="262" y1="170" x2="254" y2="180"/>
  </g>

  <!-- crate: x 115..185, y 134..170 (sits on the floor). centre (150,152) -->
  <rect x="115" y="134" width="70" height="36" rx="3" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="150" cy="152" r="2.5" fill="#e6edf3"/>

  <!-- gravity: FIELD force — from the centre, straight down -->
  <line x1="150" y1="152" x2="150" y2="214" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#pc-grey)"/>
  <text x="154" y="206" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="162" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <!-- normal: CONTACT force — from the bottom surface, straight up
       (offset left of the gravity line so the two do not coincide) -->
  <line x1="136" y1="170" x2="136" y2="108" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#pc-blue)"/>
  <text x="120" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="128" y="108" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>

  <!-- applied push: CONTACT force — starts at the LEFT (back) face, points right.
       Longest horizontal arrow: the crate is speeding up. -->
  <line x1="115" y1="148" x2="252" y2="148" stroke="#f0c27a" stroke-width="3.5" marker-end="url(#pc-amber)"/>
  <text x="236" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#f0c27a">F</text>
  <text x="244" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#f0c27a">app</text>

  <!-- kinetic friction: CONTACT force — along the bottom surface, points left.
       Shorter than the push. -->
  <line x1="170" y1="170" x2="110" y2="170" stroke="#f85149" stroke-width="3.5" marker-end="url(#pc-red)"/>
  <text x="98" y="164" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#f85149">f</text>
</svg>
