<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 208" role="img"
     aria-label="Dot free-body diagram of the block held against a wall. The block is one small dot. Four forces radiate from the edge of the dot: gravity down and static friction up, equal in length; the applied push to the left and the wall's normal force to the right, equal in length.">
  <!-- DIAGRAM RULE (master-project-prompt.md §11): DOT diagram — the object
       is one small dot (~0.5 cm) and EVERY arrow starts at the dot's edge.
       Relative lengths carry meaning: f = F_g, and F_app = F_N. -->
  <defs>
    <marker id="wbd-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
    <marker id="wbd-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="wbd-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="wbd-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>

  <circle cx="120" cy="104" r="8" fill="#e6edf3"/>

  <!-- gravity: from the bottom edge, down -->
  <line x1="120" y1="112" x2="120" y2="188" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#wbd-grey)"/>
  <text x="124" y="182" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="132" y="186" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <!-- static friction: from the top edge, up; equal length to gravity -->
  <line x1="120" y1="96" x2="120" y2="20" stroke="#f85149" stroke-width="3" marker-end="url(#wbd-red)"/>
  <text x="124" y="24" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#f85149">f</text>

  <!-- applied push: from the left edge, to the left -->
  <line x1="112" y1="104" x2="40" y2="104" stroke="#f0c27a" stroke-width="3.5" marker-end="url(#wbd-amber)"/>
  <text x="22" y="98" font-family="system-ui, sans-serif" font-size="13" fill="#f0c27a">F</text>
  <text x="30" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#f0c27a">app</text>

  <!-- normal force from the wall: from the right edge, to the right; equal length to the push -->
  <line x1="128" y1="104" x2="200" y2="104" stroke="#58a6ff" stroke-width="3" marker-end="url(#wbd-blue)"/>
  <text x="204" y="99" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="212" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>
</svg>
