<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img"
     aria-label="Free-body diagram of a crate dragged at constant speed across a rough floor by a rope at 30 degrees above horizontal. Four forces from the crate: gravity down, the normal force up (drawn shorter than gravity), tension up and to the right at 30 degrees, and kinetic friction to the left.">
  <defs>
    <marker id="dc-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
    <marker id="dc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="dc-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="dc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>

  <line x1="34" y1="152" x2="286" y2="152" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2">
    <line x1="46" y1="152" x2="38" y2="162"/><line x1="70" y1="152" x2="62" y2="162"/>
    <line x1="94" y1="152" x2="86" y2="162"/><line x1="118" y1="152" x2="110" y2="162"/>
    <line x1="142" y1="152" x2="134" y2="162"/><line x1="166" y1="152" x2="158" y2="162"/>
    <line x1="190" y1="152" x2="182" y2="162"/><line x1="214" y1="152" x2="206" y2="162"/>
    <line x1="238" y1="152" x2="230" y2="162"/><line x1="262" y1="152" x2="254" y2="162"/>
  </g>

  <rect x="116" y="120" width="58" height="32" rx="3" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="145" cy="136" r="2.5" fill="#e6edf3"/>

  <!-- gravity: full length -->
  <line x1="141" y1="136" x2="141" y2="200" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#dc-grey)"/>
  <text x="117" y="194" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="125" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <!-- normal: shorter than gravity (rope carries part of the weight) -->
  <line x1="150" y1="152" x2="150" y2="96" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#dc-blue)"/>
  <text x="156" y="106" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="164" y="110" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>

  <!-- tension: up and right at 30 degrees, from the crate -->
  <line x1="150" y1="132" x2="256" y2="71" stroke="#f0c27a" stroke-width="3" marker-end="url(#dc-amber)"/>
  <text x="224" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#f0c27a">F</text>
  <text x="232" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#f0c27a">T</text>
  <text x="196" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">30°</text>

  <!-- friction: left -->
  <line x1="145" y1="146" x2="92" y2="146" stroke="#f85149" stroke-width="3" marker-end="url(#dc-red)"/>
  <text x="62" y="140" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#f85149">f</text>
</svg>
