<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 224" role="img"
     aria-label="Free-body diagram of a crate dragged at constant speed across a rough floor by a rope pulling up and to the right at 30 degrees above horizontal. Gravity acts down from the crate's centre. The normal force acts up from the bottom surface and is drawn shorter than gravity because the rope carries part of the weight. Tension acts up and to the right at 30 degrees, starting at the top of the crate where the rope attaches. Kinetic friction acts to the left along the bottom surface.">
  <!-- DIAGRAM RULE (master-project-prompt.md §11): in a BOX diagram, a
       contact-force arrow starts at the surface / point of contact;
       only the field force (gravity) starts at the centre dot.
       Parallel arrows are laterally offset so none coincide.
       Relative arrow lengths carry meaning. -->
  <defs>
    <marker id="dc-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
    <marker id="dc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="dc-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="dc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>

  <!-- floor -->
  <line x1="34" y1="168" x2="286" y2="168" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2">
    <line x1="46" y1="168" x2="38" y2="178"/><line x1="70" y1="168" x2="62" y2="178"/>
    <line x1="94" y1="168" x2="86" y2="178"/><line x1="118" y1="168" x2="110" y2="178"/>
    <line x1="142" y1="168" x2="134" y2="178"/><line x1="166" y1="168" x2="158" y2="178"/>
    <line x1="190" y1="168" x2="182" y2="178"/><line x1="214" y1="168" x2="206" y2="178"/>
    <line x1="238" y1="168" x2="230" y2="178"/><line x1="262" y1="168" x2="254" y2="178"/>
  </g>

  <!-- crate: x 112..182, y 132..168 (sits on the floor). centre (147,150) -->
  <rect x="112" y="132" width="70" height="36" rx="3" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="147" cy="150" r="2.5" fill="#e6edf3"/>

  <!-- gravity: FIELD force — from the centre, straight down (full weight) -->
  <line x1="147" y1="150" x2="147" y2="212" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#dc-grey)"/>
  <text x="151" y="204" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="159" y="208" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <!-- normal: CONTACT force — from the bottom surface, up; SHORTER than
       gravity because the rope carries part of the weight -->
  <line x1="132" y1="168" x2="132" y2="124" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#dc-blue)"/>
  <text x="116" y="120" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="124" y="124" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>

  <!-- tension: CONTACT force — starts where the rope attaches (top of the
       crate), points up and to the right at 30 degrees -->
  <line x1="168" y1="132" x2="266" y2="76" stroke="#f0c27a" stroke-width="3.5" marker-end="url(#dc-amber)"/>
  <text x="248" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#f0c27a">F</text>
  <text x="256" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#f0c27a">T</text>
  <path d="M196 132 A 28 28 0 0 0 190 118" fill="none" stroke="#8b96a5" stroke-width="1.1"/>
  <text x="200" y="126" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">30°</text>

  <!-- kinetic friction: CONTACT force — along the bottom surface, points left -->
  <line x1="164" y1="168" x2="104" y2="168" stroke="#f85149" stroke-width="3.5" marker-end="url(#dc-red)"/>
  <text x="92" y="162" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#f85149">f</text>
</svg>
