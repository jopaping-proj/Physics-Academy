<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img"
     aria-label="Free-body diagram of a book resting on a table. Two forces, drawn equal in length: the normal force points up from the book's bottom surface, and gravity points down from the book's centre.">
  <defs>
    <marker id="fb-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
    <marker id="fb-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
  </defs>

  <line x1="40" y1="140" x2="200" y2="140" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2">
    <line x1="52" y1="140" x2="44" y2="150"/><line x1="76" y1="140" x2="68" y2="150"/>
    <line x1="100" y1="140" x2="92" y2="150"/><line x1="124" y1="140" x2="116" y2="150"/>
    <line x1="148" y1="140" x2="140" y2="150"/><line x1="172" y1="140" x2="164" y2="150"/>
  </g>

  <rect x="96" y="122" width="52" height="18" rx="2" fill="#e6edf3" fill-opacity="0.06" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="122" cy="131" r="2.5" fill="#e6edf3"/>

  <line x1="116" y1="131" x2="116" y2="196" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#fb-grey)"/>
  <text x="92" y="192" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="100" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <line x1="128" y1="140" x2="128" y2="66" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#fb-blue)"/>
  <text x="134" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="142" y="82" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>
</svg>
