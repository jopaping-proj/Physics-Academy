<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img"
     aria-label="A 120 newton tension vector at 30 degrees above the horizontal, resolved into a horizontal component of 120 cos 30 degrees which is about 104 newtons, and a vertical component of 120 sin 30 degrees which is 60 newtons. The vector and its two components form a right triangle.">
  <defs>
    <marker id="cr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="cr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- axes hint -->
  <line x1="50" y1="176" x2="50" y2="34" stroke="#2a3a5c" stroke-width="1"/>
  <line x1="40" y1="160" x2="300" y2="160" stroke="#2a3a5c" stroke-width="1"/>

  <!-- the tension vector: 120 N at 30 degrees -->
  <line x1="50" y1="160" x2="238" y2="52" stroke="#f0c27a" stroke-width="3.5" marker-end="url(#cr-amber)"/>
  <!-- label sits well above the vector line, near the tip, clear of the arrow -->
  <text x="150" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0c27a">F</text>
  <text x="159" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#f0c27a">T</text>
  <text x="165" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0c27a"> = 120 N</text>

  <!-- horizontal component -->
  <line x1="50" y1="160" x2="238" y2="160" stroke="#8b96a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cr-grey)"/>
  <text x="96" y="178" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">F</text>
  <text x="104" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#8b96a5">T,x</text>
  <text x="118" y="178" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5"> = 120 cos30° ≈ 104 N</text>

  <!-- vertical component -->
  <line x1="238" y1="160" x2="238" y2="52" stroke="#8b96a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cr-grey)"/>
  <text x="248" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">F</text>
  <text x="256" y="106" font-family="system-ui, sans-serif" font-size="9" fill="#8b96a5">T,y</text>
  <text x="248" y="118" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5"> = 120 sin30°</text>
  <text x="248" y="133" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">= 60 N</text>

  <!-- right-angle marker at the foot of the vertical component -->
  <path d="M226 160 L226 148 L238 148" fill="none" stroke="#8b96a5" stroke-width="1"/>

  <!-- angle at the origin -->
  <path d="M84 160 A 34 34 0 0 0 79 141" fill="none" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="88" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">30°</text>
</svg>
