<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img"
     aria-label="A 120 newton tension vector at 30 degrees above the horizontal, resolved into a 104 newton horizontal component and a 60 newton vertical component. The vector and its two components form a right triangle.">
  <defs>
    <marker id="cr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="cr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
  </defs>

  <!-- axes hint -->
  <line x1="50" y1="170" x2="50" y2="40" stroke="#2a3a5c" stroke-width="1"/>
  <line x1="40" y1="160" x2="290" y2="160" stroke="#2a3a5c" stroke-width="1"/>

  <!-- the tension vector, 120 N at 30 degrees -->
  <line x1="50" y1="160" x2="238" y2="52" stroke="#f0c27a" stroke-width="3.5" marker-end="url(#cr-amber)"/>
  <text x="120" y="92" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0c27a">F</text>
  <text x="128" y="96" font-family="system-ui, sans-serif" font-size="9" fill="#f0c27a">T</text>
  <text x="138" y="92" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0c27a"> = 120 N</text>

  <!-- horizontal component -->
  <line x1="50" y1="160" x2="238" y2="160" stroke="#8b96a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cr-grey)"/>
  <text x="112" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">F</text>
  <text x="120" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#8b96a5">T,x</text>
  <text x="134" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5"> = 120 cos30° ≈ 104 N</text>

  <!-- vertical component -->
  <line x1="238" y1="160" x2="238" y2="52" stroke="#8b96a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cr-grey)"/>
  <text x="246" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">F</text>
  <text x="254" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#8b96a5">T,y</text>
  <text x="246" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">= 120 sin30°</text>
  <text x="246" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#8b96a5">= 60 N</text>

  <!-- right-angle marker -->
  <path d="M226 160 L226 148 L238 148" fill="none" stroke="#8b96a5" stroke-width="1"/>

  <!-- angle -->
  <path d="M78 160 A 28 28 0 0 0 74 145" fill="none" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="80" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#8b96a5">30°</text>
</svg>
