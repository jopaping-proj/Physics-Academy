<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 216" role="img"
     aria-label="Box free-body diagram of a block held against a vertical wall on its left by a horizontal push. Gravity acts down from the block's centre. The applied push acts to the left (into the wall), starting at the block's right face. The normal force from the wall acts to the right (away from the wall), starting at the block's left face. Static friction from the wall acts straight up, starting at the block's left face where it touches the wall. The push and the normal force are equal length; friction and gravity are equal length.">
  <!-- DIAGRAM RULE (master-project-prompt.md §11): BOX diagram — a
       contact-force arrow starts at the surface / point of contact; only
       gravity (a field force) starts at the centre. Relative lengths carry
       meaning: F_app = F_N, and f = F_g. -->
  <defs>
    <marker id="wb-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b96a5"/></marker>
    <marker id="wb-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="wb-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0c27a"/></marker>
    <marker id="wb-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>

  <!-- wall on the left -->
  <line x1="90" y1="34" x2="90" y2="196" stroke="#8b96a5" stroke-width="1.5"/>
  <g stroke="#8b96a5" stroke-width="1.2">
    <line x1="90" y1="46" x2="80" y2="54"/><line x1="90" y1="66" x2="80" y2="74"/>
    <line x1="90" y1="86" x2="80" y2="94"/><line x1="90" y1="106" x2="80" y2="114"/>
    <line x1="90" y1="126" x2="80" y2="134"/><line x1="90" y1="146" x2="80" y2="154"/>
    <line x1="90" y1="166" x2="80" y2="174"/><line x1="90" y1="186" x2="80" y2="194"/>
  </g>

  <!-- block: x 90..152, y 78..150. centre (121,114) -->
  <rect x="90" y="78" width="62" height="72" rx="3" fill="#e6edf3" fill-opacity="0.05" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="121" cy="114" r="2.5" fill="#e6edf3"/>

  <!-- gravity: FIELD force — from the centre, straight down -->
  <line x1="121" y1="114" x2="121" y2="198" stroke="#8b96a5" stroke-width="2.5" marker-end="url(#wb-grey)"/>
  <text x="125" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#8b96a5">F</text>
  <text x="133" y="194" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">g</text>

  <!-- applied push: CONTACT force — starts at the RIGHT face, points left (into the wall) -->
  <line x1="152" y1="100" x2="80" y2="100" stroke="#f0c27a" stroke-width="3.5" marker-end="url(#wb-amber)"/>
  <text x="60" y="94" font-family="system-ui, sans-serif" font-size="13" fill="#f0c27a">F</text>
  <text x="68" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#f0c27a">app</text>

  <!-- normal force from the wall: CONTACT force — starts at the LEFT face, points right -->
  <line x1="90" y1="130" x2="162" y2="130" stroke="#58a6ff" stroke-width="3" marker-end="url(#wb-blue)"/>
  <text x="166" y="126" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff">F</text>
  <text x="174" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">N</text>

  <!-- static friction from the wall: CONTACT force — starts at the LEFT face
       (the wall contact), points straight up (holds the block from sliding down) -->
  <line x1="95" y1="148" x2="95" y2="66" stroke="#f85149" stroke-width="3" marker-end="url(#wb-red)"/>
  <text x="80" y="62" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#f85149">f</text>
</svg>
