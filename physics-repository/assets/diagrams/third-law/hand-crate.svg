<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img"
     aria-label="A hand pushes a crate to the right across the floor. One arrow on the crate points right, labelled force of hand on crate. One arrow on the hand points left, labelled force of crate on hand. The two arrows are the same length and point in opposite directions; each acts on a different object.">
  <!-- Hand-authored. Labels placed clear of the objects, the arrows, and
       each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="tl1-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#58a6ff"/></marker>
    <marker id="tl1-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f0c27a"/></marker>
  </defs>

  <text x="180" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b96a5">A force and its reaction act on different objects</text>

  <!-- floor -->
  <line x1="14" y1="146" x2="346" y2="146" stroke="#8b96a5" stroke-width="1.5"/>

  <!-- hand (left) -->
  <rect x="120" y="104" width="74" height="42" rx="11" fill="#8b96a5" fill-opacity="0.16" stroke="#8b96a5" stroke-width="1.4"/>
  <text x="150" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8b96a5">hand</text>

  <!-- crate (right) -->
  <rect x="210" y="98" width="76" height="48" rx="3" fill="#e6edf3" fill-opacity="0.06" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="272" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#e6edf3">crate</text>

  <!-- force of hand on crate: on the crate, from the contact face, pointing right -->
  <line x1="210" y1="114" x2="254" y2="114" stroke="#58a6ff" stroke-width="3" marker-end="url(#tl1-blue)"/>
  <text x="236" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">F (hand on crate)</text>

  <!-- force of crate on hand: on the hand, from the contact face, pointing left -->
  <line x1="192" y1="128" x2="148" y2="128" stroke="#f0c27a" stroke-width="3" marker-end="url(#tl1-amber)"/>
  <text x="150" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f0c27a">F (crate on hand)</text>

  <text x="180" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">equal size &#183; opposite direction &#183; one on the crate, one on the hand</text>
</svg>
