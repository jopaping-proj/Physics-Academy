<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 216" role="img"
     aria-label="A truck and a smaller car push on each other during a collision. The force on the truck and the force on the car are drawn the same length, pointing in opposite directions. Below, the acceleration arrows differ: the car's acceleration arrow is long, the truck's is short, because the car has much less mass.">
  <!-- Hand-authored. Labels placed clear of the objects, the arrows, and
       each other (master-project-prompt.md §11). -->
  <defs>
    <marker id="tl3-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f85149"/></marker>
    <marker id="tl3-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#3fb950"/></marker>
  </defs>

  <text x="212" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b96a5">Equal forces, unequal accelerations</text>

  <!-- road -->
  <line x1="14" y1="150" x2="410" y2="150" stroke="#8b96a5" stroke-width="1.5"/>

  <!-- truck (large) -->
  <rect x="66" y="94" width="96" height="46" rx="3" fill="#8b96a5" fill-opacity="0.16" stroke="#8b96a5" stroke-width="1.5"/>
  <circle cx="86" cy="144" r="6" fill="#8b96a5" fill-opacity="0.3" stroke="#8b96a5" stroke-width="1.2"/>
  <circle cx="142" cy="144" r="6" fill="#8b96a5" fill-opacity="0.3" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="114" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8b96a5">truck</text>

  <!-- car (small) -->
  <rect x="258" y="119" width="64" height="26" rx="3" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="272" cy="145" r="5" fill="#58a6ff" fill-opacity="0.3" stroke="#58a6ff" stroke-width="1.2"/>
  <circle cx="308" cy="145" r="5" fill="#58a6ff" fill-opacity="0.3" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="290" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#58a6ff">car</text>

  <!-- forces during contact: equal length (44), opposite directions -->
  <line x1="162" y1="112" x2="118" y2="112" stroke="#f85149" stroke-width="3" marker-end="url(#tl3-red)"/>
  <text x="140" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f85149">force on truck</text>
  <line x1="258" y1="112" x2="302" y2="112" stroke="#f85149" stroke-width="3" marker-end="url(#tl3-red)"/>
  <text x="288" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f85149">force on car</text>

  <!-- accelerations: short for the truck, long for the car -->
  <line x1="120" y1="170" x2="100" y2="170" stroke="#3fb950" stroke-width="3" marker-end="url(#tl3-green)"/>
  <text x="110" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#3fb950">a (truck)</text>
  <line x1="272" y1="170" x2="344" y2="170" stroke="#3fb950" stroke-width="3" marker-end="url(#tl3-green)"/>
  <text x="308" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#3fb950">a (car)</text>

  <text x="212" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b96a5">same force on each &#183; the car speeds up more because its mass is smaller</text>
</svg>
