<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Q3 four position-time choices</title><desc id="desc">Four nonempty plots show distinct combinations of outward motion, rest, and return. Graph C moves outward at constant positive velocity, rests, then returns to the origin with a visibly greater slope magnitude.</desc><rect width="760" height="430" fill="white"/><g font-family="Arial" font-size="18" fill="#111827"><text x="40" y="35">A</text><text x="400" y="35">B</text><text x="40" y="235">C</text><text x="400" y="235">D</text></g><g stroke="#111827" stroke-width="2" fill="none"><path d="M70 170V50M70 170H330M430 170V50M430 170H690M70 390V270M70 390H330M430 390V270M430 390H690"/></g><g stroke="#1769aa" stroke-width="5" fill="none"><polyline points="70,170 170,70 230,70 330,120"/><polyline points="430,170 530,70 590,110 690,170"/><polyline points="70,390 170,290 230,290 290,390"/><polyline points="430,390 520,290 610,290 690,290"/></g><g font-family="Arial" font-size="13" fill="#374151"><text x="312" y="190">t (s)</text><text x="18" y="60">x (m)</text><text x="672" y="190">t (s)</text><text x="378" y="60">x (m)</text><text x="312" y="410">t (s)</text><text x="18" y="280">x (m)</text><text x="672" y="410">t (s)</text><text x="378" y="280">x (m)</text></g></svg>
