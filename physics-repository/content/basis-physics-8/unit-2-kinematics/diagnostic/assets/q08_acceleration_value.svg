<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Q8 acceleration-time graph</title><desc id="desc">Acceleration is minus 2 metres per second squared from 0 to 4 seconds and plus 2 from 4 to 6 seconds.</desc><rect width="640" height="340" fill="white"/><g stroke="#d5dbe3"><path d="M110 60H560M110 150H560M110 240H560"/><path d="M110 50V280M260 50V280M410 50V280M560 50V280"/></g><g stroke="#111827" stroke-width="2"><path d="M110 40V290"/><path d="M90 150H575"/></g><path d="M110 240H410V60H560" fill="none" stroke="#1769aa" stroke-width="5"/><g font-family="Arial" fill="#111827"><text x="310" y="332">t (s)</text><text x="15" y="30">a (m/s²)</text><text x="75" y="66">+2</text><text x="75" y="246">−2</text><text x="250" y="315">2</text><text x="400" y="315">4</text><text x="550" y="315">6</text></g></svg>
