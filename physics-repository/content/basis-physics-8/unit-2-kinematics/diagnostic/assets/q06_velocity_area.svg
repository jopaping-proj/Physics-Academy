<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Q6 signed velocity-time area</title><desc id="desc">Velocity rises from zero to plus 6 by 2 seconds, remains plus 6 to 4 seconds, then falls to minus 2 at 6 seconds and crosses zero at 5 point 5.</desc><rect width="640" height="360" fill="white"/><g stroke="#d5dbe3"><path d="M100 60V300M250 60V300M400 60V300M550 60V300"/><path d="M100 70H550M100 190H550M100 270H550"/></g><g stroke="#111827" stroke-width="2"><path d="M100 45V310"/><path d="M80 230H570"/></g><path d="M513 222V238" stroke="#111827" stroke-width="2"/><path d="M513 230V300" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><polyline points="100,230 250,70 400,70 550,283" fill="none" stroke="#1769aa" stroke-width="5"/><g font-family="Arial" fill="#111827"><text x="300" y="350">t (s)</text><text x="20" y="35">v (m/s)</text><text x="92" y="330">0</text><text x="240" y="330">2</text><text x="390" y="330">4</text><text x="500" y="330">5.5</text><text x="540" y="330">6</text><text x="70" y="76">+6</text><text x="70" y="288">−2</text></g><path d="M100 230L250 70L400 70L550 283L550 230Z" fill="#72b7e6" opacity=".25"/></svg>
