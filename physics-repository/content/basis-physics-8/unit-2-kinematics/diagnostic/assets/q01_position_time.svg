<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Q1 position-time graph</title><desc id="desc">Position is plus 8 metres at 2 seconds and minus 1 metre at 7 seconds.</desc><rect width="640" height="360" fill="white"/><g stroke="#d5dbe3" stroke-width="1"> <path d="M90 50V300M160 50V300M230 50V300M300 50V300M370 50V300M440 50V300M510 50V300M580 50V300"/><path d="M90 70H580M90 110H580M90 150H580M90 190H580M90 230H580M90 270H580"/></g><g stroke="#111827" stroke-width="2"><path d="M90 40V310"/><path d="M80 230H590"/></g><g fill="#111827" font-family="Arial" font-size="15"><text x="310" y="350">t (s)</text><text x="20" y="35">x (m)</text><text x="83" y="330">0</text><text x="222" y="330">2</text><text x="362" y="330">4</text><text x="572" y="330">7</text><text x="55" y="115">8</text><text x="55" y="195">2</text><text x="48" y="275">−1</text></g><polyline points="90,190 230,110 370,110 580,270" fill="none" stroke="#1769aa" stroke-width="5" stroke-linejoin="round"/><g fill="#1769aa"><circle cx="90" cy="190" r="5"/><circle cx="230" cy="110" r="5"/><circle cx="370" cy="110" r="5"/><circle cx="580" cy="270" r="5"/></g></svg>
