<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Q4 constant-velocity intervals</title><desc id="desc">Interval I is horizontal at plus 4 metres per second, II slopes downward, and III is horizontal at minus 4.</desc><rect width="640" height="360" fill="white"/><g stroke="#d5dbe3"><path d="M100 70H560M100 150H560M100 230H560M100 310H560"/><path d="M100 50V310M250 50V310M400 50V310M550 50V310"/></g><g stroke="#111827" stroke-width="2"><path d="M100 40V320"/><path d="M80 190H570"/></g><polyline points="100,110 250,110 400,270 550,270" fill="none" stroke="#1769aa" stroke-width="5"/><g font-family="Arial" fill="#111827"><text x="575" y="210">t (s)</text><text x="25" y="35">v (m/s)</text><text x="70" y="115">+4</text><text x="70" y="275">−4</text><text x="165" y="95">I</text><text x="320" y="95">II</text><text x="470" y="258">III</text><text x="240" y="340">2</text><text x="390" y="340">4</text><text x="540" y="340">6</text></g></svg>
