<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Q5 velocity-time slope</title><desc id="desc">A straight segment joins 1 second, plus 6 metres per second to 5 seconds, minus 2.</desc><rect width="640" height="360" fill="white"/><g stroke="#d5dbe3"><path d="M110 60V300M200 60V300M290 60V300M380 60V300M470 60V300M560 60V300"/><path d="M110 70H560M110 130H560M110 190H560M110 250H560"/></g><g stroke="#111827" stroke-width="2"><path d="M110 45V310"/><path d="M90 190H575"/></g><line x1="200" y1="70" x2="560" y2="250" stroke="#1769aa" stroke-width="5"/><g fill="#1769aa"><circle cx="200" cy="70" r="6"/><circle cx="560" cy="250" r="6"/></g><g font-family="Arial" fill="#111827"><text x="580" y="210">t (s)</text><text x="20" y="35">v (m/s)</text><text x="180" y="330">1</text><text x="545" y="330">5</text><text x="75" y="76">+6</text><text x="75" y="256">−2</text></g></svg>
