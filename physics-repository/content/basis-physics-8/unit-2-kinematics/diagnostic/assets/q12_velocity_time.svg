<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Q12 velocity-time graph</title><desc id="desc">Velocity is minus 4 metres per second from 0 to 1 second, then rises linearly to plus 6 metres per second at 3 seconds.</desc><rect width="640" height="360" fill="white"/><g stroke="#d5dbe3"><path d="M110 70H560M110 190H560M110 270H560"/><path d="M110 50V300M260 50V300M560 50V300"/></g><g stroke="#111827" stroke-width="2"><path d="M110 40V310"/><path d="M90 230H580"/></g><polyline points="110,270 260,270 560,70" fill="none" stroke="#1769aa" stroke-width="5"/><g font-family="Arial" fill="#111827"><text x="300" y="350">t (s)</text><text x="18" y="30">v (m/s)</text><text x="102" y="330">0</text><text x="252" y="330">1</text><text x="552" y="330">3</text><text x="70" y="76">+6</text><text x="70" y="276">−4</text></g></svg>
