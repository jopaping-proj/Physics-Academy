<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Q7 four velocity-time choices</title><desc id="desc">Four nonempty plots show distinct motion sequences. Graph D starts at negative velocity, rises uniformly to zero, remains at zero, rises uniformly to positive velocity, and then becomes horizontal.</desc><rect width="760" height="430" fill="white"/><g font-family="Arial" font-size="18" fill="#111827"><text x="40" y="35">A</text><text x="400" y="35">B</text><text x="40" y="235">C</text><text x="400" y="235">D</text><text x="78" y="55">v (m/s)</text><text x="315" y="135">t (s)</text><text x="438" y="55">v (m/s)</text><text x="675" y="135">t (s)</text><text x="78" y="255">v (m/s)</text><text x="315" y="335">t (s)</text><text x="438" y="255">v (m/s)</text><text x="675" y="335">t (s)</text></g><g stroke="#111827" stroke-width="2" fill="none"><path d="M70 110H330M70 40V180M430 110H690M430 40V180M70 310H330M70 240V400M430 310H690M430 240V400"/></g><g stroke="#1769aa" stroke-width="5" fill="none"><polyline points="70,70 150,110 210,110 260,70 330,70"/><polyline points="430,150 510,150 570,110 630,70 690,70"/><polyline points="70,350 150,270 230,350 330,270"/><polyline points="430,360 510,310 570,310 630,260 690,260"/></g></svg>
