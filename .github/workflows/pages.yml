name: Deploy site to GitHub Pages

# Builds physics-repository/ into dist/ and publishes it as the Pages site.
# The build is a single zero-dependency Node script (see docs/architecture-proposal.md §8).

on:
  push:
    branches: [main]
    paths:
      - "physics-repository/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Pages publishes from this workflow (not a branch)
        # `configure-pages`/`enablement` only *creates* a Pages site; it does
        # NOT switch an existing "Deploy from a branch" site to "GitHub
        # Actions". The API PUT below does — but the built-in GITHUB_TOKEN is
        # not allowed to change that setting, so this only works if you add a
        # repo secret PAGES_TOKEN (a fine-grained PAT with "Pages: write" on
        # this repo). Without it, flip the source once by hand:
        #   Settings -> Pages -> Source -> "GitHub Actions".
        # See docs/deploying-github-pages.md.
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages build_type=workflow -> HTTP $code"; cat /tmp/pages.json || true
          if [ "$code" = "403" ]; then
            echo "::warning::Could not switch the Pages source automatically. Set it once: Settings -> Pages -> Source -> GitHub Actions (or add a PAGES_TOKEN secret)."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the static site
        working-directory: physics-repository
        run: node build/build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: physics-repository/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
