name: Deploy site to GitHub Pages

# Builds physics-repository/ into dist/ and publishes it as the Pages site.
# The build is a single zero-dependency Node script (see docs/architecture-proposal.md §8).

on:
  push:
    branches: [main]
    paths:
      - "physics-repository/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the static site
        working-directory: physics-repository
        run: node build/build.js
      - uses: actions/configure-pages@v5
        with:
          # Switch the repo's Pages source to "GitHub Actions" automatically on
          # the first run, so no manual Settings -> Pages toggle is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: physics-repository/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
